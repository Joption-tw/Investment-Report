<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 手機直向：整份排成一頁（用電腦版版面寬 1040 排好，再縮到螢幕寬，可雙指放大）；手機橫向：一般寬度 + 兩頁（見下方 CSS）
        (function () {
            const meta = document.querySelector('meta[name="viewport"]');
            const portrait = matchMedia('(orientation: portrait)');
            const side = Math.min(screen.width, screen.height);
            function apply() {
                const on = side < 600 && portrait.matches;
                document.documentElement.classList.toggle('m-portrait', on);
                meta.setAttribute('content', on ? `width=1040, initial-scale=${(side / 1040).toFixed(3)}, minimum-scale=${(side / 1040).toFixed(3)}, maximum-scale=6` : 'width=device-width, initial-scale=1.0, viewport-fit=cover');
                syncVisible();
            }
            // 手機橫向用：實際可視範圍（放大時不跟著變，否則版面會亂跳）
            function syncVisible() {
                const v = window.visualViewport;
                if (!v || v.scale > 1.01) return;
                const st = document.documentElement.style;
                st.setProperty('--vv-top', `${v.offsetTop}px`);
                st.setProperty('--vv-h', `${v.height}px`);
                if (!portrait.matches && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
            }
            apply();
            portrait.addEventListener('change', apply);
            if (window.visualViewport) {
                visualViewport.addEventListener('resize', syncVisible);
                visualViewport.addEventListener('scroll', syncVisible);
            }
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        html, body { margin: 0; background-color: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased; }

        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .live-indicator { animation: pulse-soft 2s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 打橫提示只在手機直向出現 */
        #rotate-hint { display: none; }
        /* 可放大的頁面上，按鈕要關掉雙擊縮放，否則連按會被當成縮放手勢 */
        button, a, select { touch-action: manipulation; }

        /* ===== 電腦與手機橫向：分兩頁，第 1 頁數字 + 走勢圖、第 2 頁每盤績效表；手機直向整份一頁 ===== */
        html:not(.m-portrait) #page-session { display: none; }
        html:not(.m-portrait) body.m-page-2 #app-root > *:not(header) { display: none !important; }
        html:not(.m-portrait) body.m-page-2 #app-root > #page-session { display: block !important; }
        html:not(.m-portrait) #app-root { padding-bottom: 72px; }
        /* 換頁鈕放右下角並加大：iPhone 橫向時，點螢幕最上緣常被 Safari 拿去叫出網址列，按鈕收不到 */
        #page-btn { display: none; }
        html:not(.m-portrait) #page-btn { display: inline-flex; align-items: center; justify-content: center; position: fixed; z-index: 60;
                    right: max(10px, env(safe-area-inset-right)); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 8px);
                    min-width: 108px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #1e293b; color: #fff; font-size: 14px; font-weight: 900; white-space: nowrap;
                    box-shadow: 0 2px 10px rgba(15, 23, 42, .35); cursor: pointer; }
        #page-btn:hover { background: #334155; }
        #page-btn:active { background: #2563eb; transform: scale(.96); }

        /* ===== 手機直向：整份一頁（圖表撐滿剩餘高度），字放大 ===== */
        html.m-portrait #app-root { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 6px !important; }
        html.m-portrait #app-root > * { flex: 0 0 auto; }
        html.m-portrait #chart-card { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
        html.m-portrait #performance-chart { flex: 1 1 auto; height: auto !important; min-height: 340px; }
        html.m-portrait #rotate-hint { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 16px; border-radius: 14px;
            background: #fef3c7; border: 3px solid #f59e0b; color: #92400e; font-size: 38px; font-weight: 900; line-height: 1.15; }
        html.m-portrait .rotate-hint-icon { width: 46px; height: 46px; transform: rotate(90deg); flex: none; }
        html.m-portrait #stats-row .glass-card { padding: 6px 3px !important; }
        html.m-portrait #stats-row .glass-card p:first-child { font-size: 12px !important; white-space: nowrap; }
        html.m-portrait #stats-row .stat-value { font-size: 18px !important; }
        html.m-portrait #stats-row p:last-child:not(:first-child) { font-size: 13px !important; white-space: nowrap; }
        html.m-portrait .session-btn { font-size: 18px !important; }
        html.m-portrait .session-btn span:last-child { font-size: 14px !important; }
        html.m-portrait #line-picker button, html.m-portrait #line-picker > span:first-child { font-size: 17px !important; }
        html.m-portrait #app-root th { padding: 6px 2px !important; font-size: 14px !important; line-height: 1.15 !important; letter-spacing: 0 !important; white-space: normal !important; }
        html.m-portrait #app-root td { padding: 6px 3px !important; font-size: 15px !important; line-height: 1.2 !important; }
        html.m-portrait #page-session td div + div { font-size: 12px !important; line-height: 1.1 !important; }
        html.m-portrait #page-session h2 { font-size: 22px !important; }
        html.m-portrait #page-session h2 ~ span, html.m-portrait #page-session label, html.m-portrait #page-session select { font-size: 15px !important; }
        html.m-portrait #page-session > p { font-size: 14px !important; }
        html.m-portrait #win-strip span { font-size: 14px !important; }
        html.m-portrait #win-strip .h-9 { font-size: 20px !important; }

        /* ===== 手機橫向（打橫）：版面固定貼齊可視範圍 ===== */
        @media (orientation: landscape) and (max-height: 600px) {
            html, body { height: 100%; overflow: hidden !important; }

            /* 固定貼齊實際可視範圍的最上方（iPhone 轉橫向時頁面可能被往下推）；左右只讓開瀏海 */
            #app-root { position: fixed !important; top: calc(var(--vv-top, 0px) + 2px);
                        left: max(3px, env(safe-area-inset-left)); right: max(3px, env(safe-area-inset-right));
                        height: calc(var(--vv-h, 100vh) - 4px); max-width: none !important; margin: 0 !important; padding: 0 !important;
                        display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
            #app-root > * { margin: 0 !important; flex: 0 0 auto; }

            /* 頁首：壓成一行 */
            header { display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 1px 8px !important; gap: 8px !important; }
            header > div:nth-child(2) { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
            header h1 { font-size: 0.9rem !important; line-height: 1.1 !important; white-space: nowrap; }
            header h1 span { font-size: 10px !important; line-height: 1 !important; margin-left: 4px !important; }
            header > div:nth-child(2) > div { margin: 0 !important; flex-wrap: nowrap !important; min-width: 0; }
            header > div:nth-child(2) > div > span:first-child { display: none !important; }
            header > div:nth-child(2) button { font-size: 10px !important; padding: 0 8px !important; }
            header > div:last-child { flex: 0 0 auto; flex-direction: row !important; align-items: center !important; gap: 6px !important; }

            /* 八張統計卡一整排：壓到最扁，數字為主 */
            #stats-row { grid-template-columns: none !important; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px !important; }
            #stats-row .glass-card { min-height: 0 !important; padding: 1px 4px !important; border-left-width: 3px !important; }
            #stats-row .glass-card p:first-child { font-size: 8px !important; line-height: 1.1 !important; margin: 0 !important; white-space: nowrap; overflow: hidden; }
            #stats-row .stat-value { font-size: 12px !important; line-height: 1.15 !important; }
            #stats-row p:last-child:not(:first-child) { font-size: 8px !important; line-height: 1 !important; margin: 0 !important; white-space: nowrap; overflow: hidden; }

            /* 十個盤別 + 整週一整排：壓扁 */
            #session-row { padding: 1px !important; }
            #session-row > div { grid-template-columns: repeat(11, minmax(0, 1fr)) !important; gap: 2px !important; }
            .session-btn { padding: 1px !important; gap: 0; font-size: 10px !important; line-height: 1.1; border-radius: 0.3rem !important; white-space: nowrap; overflow: hidden; }
            .session-btn span:last-child { font-size: 8px !important; }
            .session-btn.active { transform: none; box-shadow: none; }

            /* 圖表卡：撐滿剩餘高度；選線按鈕擠成一行 */
            #chart-card { flex: 1 1 auto !important; min-height: 0 !important; display: flex !important; flex-direction: column !important; padding: 2px !important; }
            #chart-card > * { margin-bottom: 0 !important; flex: 0 0 auto; }
            #line-picker { flex-wrap: nowrap !important; justify-content: flex-start !important; gap: 3px !important; padding: 0 !important; overflow-x: auto; scrollbar-width: none; }
            #line-picker::-webkit-scrollbar { display: none; }
            #chart-card > .h-\[440px\] { flex: 1 1 auto; height: auto !important; min-height: 0; }
            #line-picker > span:first-child { display: none !important; }
            #line-picker > span { gap: 3px !important; }
            #line-picker button { flex: 0 0 auto; min-height: 24px; padding: 0 7px !important; font-size: 10px !important; white-space: nowrap; border-width: 1.5px !important; }
            #performance-chart { flex: 1 1 auto !important; height: auto !important; min-height: 0 !important; }

            /* 第 2 頁：勝敗條跟表格的勝負欄重複，收起來把空間留給表格 */
            #win-strip { display: none; }
            #page-session > div:first-child { padding: 1px 8px !important; }
            #page-session h2 { font-size: 12px !important; white-space: nowrap; }
            #page-session h2 ~ span, #page-session label { font-size: 9.5px !important; }
            #page-session select { padding: 0 4px !important; font-size: 11px !important; min-height: 22px; }
            #page-session > p { padding: 3px 8px !important; }
            #page-session { --fit-font: clamp(9.5px, calc((100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) * .0145), 11px); }
            #page-session table { width: 100% !important; }
            #page-session th { padding: 2px !important; font-size: 9.5px !important; line-height: 1.1 !important; letter-spacing: 0 !important; white-space: normal !important; }
            #page-session td { padding: 1px 3px !important; font-size: var(--fit-font) !important; line-height: 1.15 !important; }
            #page-session td div + div { font-size: 8px !important; line-height: 1 !important; }
            #page-session td .h-7 { width: 22px !important; height: 16px !important; font-size: 10px !important; }
            body.m-page-2 #app-root { overflow-y: auto; padding-bottom: 64px !important; }

            /* 操作鈕都放最下面並加大：iPhone 橫向時，點螢幕最上緣常被 Safari 拿去叫出網址列，按鈕收不到 */
            /* 左下回總表；右下同步數據、換頁；圖表的時間軸和拉桿會讓開（見 PerfChart） */
            header > a, header > div:last-child button {
                        display: inline-flex; align-items: center; justify-content: center; position: fixed; z-index: 60;
                        bottom: calc(max(6px, env(safe-area-inset-bottom)) + 8px);
                        min-height: 44px; border-radius: 12px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 10px rgba(15, 23, 42, .35); }
            header > div:last-child button { right: calc(max(10px, env(safe-area-inset-right)) + 114px); width: 104px; padding: 0 !important; font-size: 13px !important; }
            header > a { left: max(10px, env(safe-area-inset-left)); width: 76px; padding: 0 !important; font-size: 13px !important; align-self: auto !important; }
            header > div:last-child button:active, header > a:active { background: #2563eb; transform: scale(.96); }
        }
    </style>

<body>
    <button id="page-btn" type="button" onclick="setMobilePage(mobilePage === 2 ? 1 : 2)">下一頁 ▶</button>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;">
            <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#eab308;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="font-family:'Noto Sans TC',sans-serif;color:#64748b;margin:0;">載入中，請稍候…</p>
        </div>
    </div>
    <script>
        // 單一帳號的績效頁：account.html?id=<代號>（代號見 common.js 的 ACCOUNTS），版面參考 sample（示範帳戶即時績效）
        // 走勢：該帳號每 2 分鐘的「兩分鐘紀錄」＋績效表每 10 分鐘的快照（試算表只留最近的，更早的由 GitHub Actions 存到 data/series/<週>.json）
        //       期指 / 週三、週五時價取自示範帳戶試算表（每 2 分鐘）
        // 換頁：電腦與手機橫向分兩頁（手機直向整份一頁，CSS 不看這個 class）；回到第 1 頁時圖表要重新量尺寸（藏起來時量不到）
        let mobilePage = 1;
        function setMobilePage(n) {
            mobilePage = n;
            document.body.classList.toggle('m-page-2', n === 2);
            document.getElementById('page-btn').innerText = n === 2 ? '◀ 上一頁' : '下一頁 ▶';
            const root = document.getElementById('app-root');
            if (root) root.scrollTop = 0;
            window.scrollTo(0, 0);
            if (n === 1) window.dispatchEvent(new Event('resize'));
        }

        const { useState, useEffect, useCallback, useRef } = React;
        const params = new URLSearchParams(location.search);
        const ACCT = ACCOUNTS.find(a => a.id === params.get('id')) || accountOf(params.get('name'));
        // 2026 年起的歷史：下單程式的合約紀錄 + 試算表的時間價值 + 期交所 VIX（scripts/import_demo_history.ts），只有這些帳號有；同一盤以網站存檔為準
        const HISTORY_DIRS = { demo: 'data/demo-history', mtk: 'data/mtk-history' };
        const HISTORY_DIR = (ACCT && HISTORY_DIRS[ACCT.id]) || null;
        const HISTORY_UNTIL = '2026-10-28';   // 這一週起網站自己有完整紀錄
        const withHistory = (history, own) => {
            if (!history) return own;
            const has = new Set(own.map(s => `${s.week}#${s.slot}`));
            return [...history.filter(s => !has.has(`${s.week}#${s.slot}`)), ...own].sort((a, b) => a.week < b.week ? -1 : a.week > b.week ? 1 : a.slot - b.slot);
        };

        // 走勢圖每一條線都可以自己開關；同一個軸的線共用刻度，只有畫出來的線的軸才顯示
        const AXES = {
            fut:    { name: '期指',   side: 'left',  color: '#2563eb', scale: true },
            pts:    { name: '總點',   side: 'left',  color: '#475569', min: 0 },
            rate:   { name: '獲利%',  side: 'right', color: '#e11d48', fmt: v => `${v}%` },
            pnl:    { name: '獲利',   side: 'right', color: '#d97706' },
            price:  { name: '時價',   side: 'right', color: '#9333ea', scale: true },
            ratio:  { name: '比值',   side: 'right', color: '#ca8a04', min: 0, max: 1 },
            margin: { name: '剩餘%',  side: 'right', color: '#6366f1', min: 0, max: 100, fmt: v => `${v}%` }
        };
        const AXIS_KEYS = Object.keys(AXES);
        // 線的樣式跟 sample 網站一樣：平滑、2.2 粗、淡陰影；最高 / 最低點標數字（peak）
        // 獲利率 / 獲利金額畫「當盤」的（field：每盤從 0 起算，不累積）；獲利率畫面積：賺 = 淡粉紅、賠 = 淡綠
        const SERIES_DEFS = [
            { key: 'fut',    label: '期指',           axis: 'fut',    color: '#2563eb', src: 'demo', z: 5, peak: { max: '#ef4444', min: '#10b981', bold: true } },
            { key: 'pts',    label: '總點數',         axis: 'pts',    color: '#334155', src: 'acc',  z: 5, peak: { max: '#64748b' } },
            { key: 'rate',   label: '獲利率',         axis: 'rate',   color: '#e11d48', src: 'acc',  z: 1, field: 'srate', area: true, unit: '%', d: 2, peak: { max: '#22d3ee', min: '#ec4899', bold: true } },
            { key: 'pnl',    label: '獲利金額',       axis: 'pnl',    color: '#d97706', src: 'acc',  z: 3, field: 'spnl' },
            { key: 'ba',     label: '週三時價',       axis: 'price',  color: '#ef4444', src: 'demo', z: 4, peak: { max: '#ef4444' } },
            { key: 'bb',     label: '週五時價',       axis: 'price',  color: '#10b981', src: 'demo', z: 4, peak: { max: '#10b981' } },
            { key: 'ratio',  label: '買權比值',       axis: 'ratio',  color: '#ca8a04', src: 'acc',  z: 3, d: 2 },
            { key: 'margin', label: '保證金剩餘比率', axis: 'margin', color: '#6366f1', src: 'acc',  z: 3, unit: '%' }
        ];
        const AREA_UP = '#f9a8d4', AREA_DOWN = '#86efac';
        // 面積從 0 畫到線：0 以上一律粉紅、0 以下一律綠（漸層在 0 的位置硬切換）
        const signFill = data => {
            const vs = data.map(d => d[1]).filter(v => v != null);
            const hi = Math.max(0, ...vs), lo = Math.min(0, ...vs);
            if (hi === lo) return AREA_UP;
            const z = hi / (hi - lo);
            return new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: AREA_UP }, { offset: z, color: AREA_UP }, { offset: z, color: AREA_DOWN }, { offset: 1, color: AREA_DOWN }]);
        };
        const peakPoints = (s, fmt, fontSize) => {
            if (!s.peak) return undefined;
            const label = (color, position, offset) => ({ color, position, offset, formatter: p => fmt(p.value, s) });
            return { symbol: 'circle', symbolSize: 0, label: { show: true, fontSize, fontWeight: s.peak.bold ? 'bold' : 'normal' },
                     data: [s.peak.max && { type: 'max', label: label(s.peak.max, 'top', [0, -5]) },
                            s.peak.min && { type: 'min', label: label(s.peak.min, 'bottom', [0, 5]) }].filter(Boolean) };
        };
        const DEFAULT_SHOWN = ['pts', 'rate', 'ba', 'bb'];
        const SHOWN_KEY = 'ir-account-chart-lines';
        const loadShown = () => {
            try { const v = JSON.parse(localStorage.getItem(SHOWN_KEY)); if (Array.isArray(v)) return v.filter(k => SERIES_DEFS.some(s => s.key === k)); } catch (e) {}
            return DEFAULT_SHOWN;
        };
        const saveShown = v => { try { localStorage.setItem(SHOWN_KEY, JSON.stringify(v)); } catch (e) {} };

        // 橡皮擦開著時：在圖上按住拖曳，游標 16px 內的點都塗掉（onErase），放開時送出（onEraseEnd）
        const ERASE_KEY_STORE = 'ir-erase-key';
        const getEraseKey = () => { try { return localStorage.getItem(ERASE_KEY_STORE) || ''; } catch (e) { return ''; } };
        const setEraseKeyStore = v => { try { v ? localStorage.setItem(ERASE_KEY_STORE, v) : localStorage.removeItem(ERASE_KEY_STORE); } catch (e) {} };

        const PerfChart = ({ acc, demo, range, shown, wholeWeek, hidden, eraser, onErase, onEraseEnd }) => {
            const ref = useRef(null), chart = useRef(null), drawn = useRef([]), lastRange = useRef(null);
            const live = useRef({});
            live.current = { eraser, onErase, onEraseEnd };
            // 手機轉向時重畫（直向、橫向的字級和邊界不同）
            const [turned, setTurned] = useState(0);
            useEffect(() => {
                const portrait = matchMedia('(orientation: portrait)');
                const onTurn = () => setTurned(n => n + 1);
                portrait.addEventListener('change', onTurn);
                return () => portrait.removeEventListener('change', onTurn);
            }, []);
            useEffect(() => {
                const c = chart.current = echarts.init(ref.current);
                const onResize = () => c.resize();
                window.addEventListener('resize', onResize);
                let painting = false;
                const eraseAt = (x, y) => {
                    const R = 16, t0 = c.convertFromPixel({ xAxisIndex: 0 }, x - R), t1 = c.convertFromPixel({ xAxisIndex: 0 }, x + R);
                    const found = [];
                    drawn.current.forEach(d => d.points.forEach(([t, v]) => {
                        if (t < t0 || t > t1 || v === null || v === undefined) return;
                        const [px, py] = c.convertToPixel({ seriesIndex: d.seriesIndex }, [t, v]);
                        if (Math.hypot(px - x, py - y) <= R) found.push({ def: d.def, t });
                    }));
                    if (found.length) live.current.onErase(found);
                };
                const zr = c.getZr();
                zr.on('mousedown', e => { if (!live.current.eraser) return; painting = true; eraseAt(e.offsetX, e.offsetY); });
                zr.on('mousemove', e => { if (painting) eraseAt(e.offsetX, e.offsetY); });
                const end = () => { if (painting) { painting = false; live.current.onEraseEnd(); } };
                zr.on('mouseup', end);
                zr.on('globalout', end);
                return () => { window.removeEventListener('resize', onResize); c.dispose(); };
            }, []);
            useEffect(() => {
                const [min, max] = range;
                // 同一個時間範圍重畫（塗掉、開關線）時保留目前的縮放
                let zoom = [0, 100];
                const rk = `${min}-${max}`;
                if (lastRange.current === rk) { const dz = (chart.current.getOption().dataZoom || [])[1]; if (dz) zoom = [dz.start, dz.end]; }
                lastRange.current = rk;
                const src = { acc: acc.filter(p => p.t >= min && p.t <= max), demo: demo.filter(p => p.t >= min && p.t <= max) };
                const on = SERIES_DEFS.filter(s => shown.includes(s.key));
                const used = AXIS_KEYS.filter(k => on.some(s => s.axis === k));
                // 手機（含打橫：寬度雖大但高度很矮）；直向是用 1040 寬排版再縮小，圖上的字和拉桿要放大；橫向下方拉桿讓開換頁鈕
                const mPortrait = document.documentElement.classList.contains('m-portrait');
                const mLandscape = matchMedia('(orientation: landscape) and (max-height: 600px)').matches;
                const phone = window.innerWidth < 768 || mPortrait || mLandscape;
                const fontSize = mPortrait ? 18 : 10;
                const axisW = mPortrait ? 80 : mLandscape ? 42 : 55;
                // 橫向：最下面一排是操作鈕（高 44），拉桿夾在中間，時間軸排在這一排上面；按鈕離底的距離含 iPhone 底部安全區，直接量（圖表離螢幕底約 4）
                const barBottom = mLandscape ? parseFloat(getComputedStyle(document.getElementById('page-btn')).bottom) - 4 : 0;
                // 手機寬度不夠：每邊只顯示一個軸的刻度（其他線一樣用自己的刻度畫）
                const usedAxes = phone ? used.filter(k => used.find(x => AXES[x].side === AXES[k].side) === k) : used;
                const offsetOf = {}, count = { left: 0, right: 0 };
                usedAxes.forEach(k => { offsetOf[k] = count[AXES[k].side]++ * axisW; });
                const byName = Object.fromEntries(SERIES_DEFS.map(s => [s.label, s]));
                // 每條線：拿掉塗掉的點 → 過濾跳點（示範帳戶資料在上層已過濾）→ 跟前後兩點平均，跟 sample 一樣
                // 當盤的線（field）在盤與盤之間斷開，下一盤重新從 0 畫起
                const lines = SERIES_DEFS.map((s, i) => {
                    if (!shown.includes(s.key)) return { def: s, seriesIndex: i, points: [] };
                    const f = s.field || s.key;
                    let pts = src[s.src].filter(p => !hidden(s, p.t));
                    if (s.src === 'acc') pts = despike(pts, [f]);
                    const points = smooth3(pts.map(p => [p.t, p[f]]));
                    if (!s.field) return { def: s, seriesIndex: i, points };
                    const cut = [];
                    points.forEach(([t, v], k) => {
                        if (!k || pts[k].slot !== pts[k - 1].slot) { if (k) cut.push([t - 2 * 60e3, null]); cut.push([t - 60e3, 0]); }
                        cut.push([t, v]);
                    });
                    return { def: s, seriesIndex: i, points: cut };
                });
                const fmt = (v, s) => v === null || v === undefined ? '—' : s && s.d ? `${v.toFixed(s.d)}${s.unit || ''}` : `${Math.round(v).toLocaleString()}${s && s.unit || ''}`;
                chart.current.setOption({
                    animation: false,
                    textStyle: { fontFamily: 'Arial' },
                    grid: mLandscape ? { left: count.left * axisW + 4, right: count.right * axisW + 4, top: 24, bottom: barBottom + 44 + (wholeWeek ? 32 : 20) }
                        : { left: count.left * axisW + 15, right: count.right * axisW + 15, top: mPortrait ? 44 : 30, bottom: mPortrait ? 110 : 70 },
                    tooltip: { show: !eraser, trigger: 'axis', axisPointer: { type: 'line' }, confine: true, textStyle: { fontSize: mPortrait ? 24 : 14 },
                        formatter: ps => ps.length ? `<b>${mdhm(ps[0].value[0])}</b><br>` + ps.map(p => `${p.marker}${p.seriesName}：<b>${fmt(p.value[1], byName[p.seriesName])}</b>`).join('<br>') : '' },
                    xAxis: { type: 'time', min, max, splitLine: { show: false },
                        axisLabel: { hideOverlap: true, color: '#64748b', fontWeight: 'bold', fontSize: mPortrait ? fontSize : undefined, formatter: v => wholeWeek ? mdhm(v).replace(' ', '\n') : hhmm(v) } },
                    yAxis: AXIS_KEYS.map(k => {
                        const a = AXES[k], first = usedAxes[0] === k;
                        return { type: 'value', name: a.name, nameGap: mLandscape ? 8 : undefined, nameTextStyle: mPortrait ? { fontSize } : undefined, position: a.side, offset: offsetOf[k] || 0, show: usedAxes.includes(k),
                                 scale: !!a.scale, min: a.min, max: a.max,
                                 axisLabel: { color: a.color, fontWeight: 'bold', fontSize, formatter: a.fmt },
                                 splitLine: first ? { lineStyle: { type: 'dashed', color: '#f1f5f9' } } : { show: false } };
                    }),
                    dataZoom: [
                        // 滾輪留給頁面捲動：電腦按住 Ctrl + 滾輪縮放、拖曳平移；手機只用下方拉桿
                        { type: 'inside', xAxisIndex: 0, start: zoom[0], end: zoom[1], filterMode: 'none', disabled: eraser || phone,
                          zoomOnMouseWheel: 'ctrl', moveOnMouseWheel: false, moveOnMouseMove: true },
                        { type: 'slider', xAxisIndex: 0, start: zoom[0], end: zoom[1], filterMode: 'none', showDetail: false, brushSelect: false,
                          ...(mLandscape ? { left: 92, right: 236, bottom: barBottom + 13, height: 18 } : mPortrait ? { bottom: 10, height: 44 } : { bottom: 8, height: 24 }) }
                    ],
                    series: lines.map(({ def: s, points: data }) => {
                        const color = s.area ? signFill(data) : s.color;
                        return {
                            name: s.label, type: 'line', yAxisIndex: AXIS_KEYS.indexOf(s.axis), data, connectNulls: !s.field,
                            smooth: true, showSymbol: false, z: s.z,
                            lineStyle: s.area ? { width: 1, color } : { width: 2.2, color, shadowBlur: 3 }, itemStyle: { color: s.area ? s.color : color }, emphasis: { disabled: true },
                            areaStyle: s.area ? { color, opacity: 0.35 } : undefined,
                            markPoint: data.length ? peakPoints(s, fmt, fontSize) : undefined,
                            markLine: s.key === 'rate' && data.length ? { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: '#cbd5e1', type: 'solid' }, data: [{ yAxis: 0 }] } : undefined
                        };
                    })
                }, true);
                drawn.current = lines;
            }, [acc, demo, range, shown, wholeWeek, hidden, eraser, turned]);
            return html`<div id="performance-chart" ref=${ref} style=${eraser ? { cursor: 'crosshair', touchAction: 'none' } : undefined}></div>`;
        };

        // 走勢圖上方的開關：每一條線一顆，點了就顯示 / 隱藏
        const LinePicker = ({ shown, setShown }) => {
            const toggle = k => setShown(shown.includes(k) ? shown.filter(x => x !== k) : [...shown, k]);
            return html`
                <div id="line-picker" className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mb-3 px-1">
                    <span className="w-full sm:w-auto text-center text-[10px] font-black text-slate-400 sm:mr-1">點選要看的線：</span>
                    ${SERIES_DEFS.map(s => {
                        const on = shown.includes(s.key);
                        return html`
                            <button key=${s.key} onClick=${() => toggle(s.key)} aria-pressed=${on}
                                    className=${"inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full border-2 text-[11px] sm:text-xs font-black transition-all active:scale-95 " + (on ? 'text-white shadow-sm' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-400')}
                                    style=${on ? { background: s.color, borderColor: s.color } : undefined}>
                                <span className="w-2.5 h-2.5 rounded-full border-2" style=${{ borderColor: on ? 'white' : s.color, background: on ? 'white' : 'transparent' }}></span>
                                ${s.label}
                            </button>`;
                    })}
                    <span className="flex gap-1.5">
                        <button onClick=${() => setShown(SERIES_DEFS.map(s => s.key))} className="px-2.5 py-1.5 rounded-full text-[11px] font-black text-slate-500 bg-slate-100 hover:bg-slate-200">全部</button>
                        <button onClick=${() => setShown(DEFAULT_SHOWN)} className="px-2.5 py-1.5 rounded-full text-[11px] font-black text-slate-500 bg-slate-100 hover:bg-slate-200">預設</button>
                    </span>
                </div>`;
        };

        const Stat = ({ label, color, children, sub }) => html`
            <div className=${"glass-card py-1.5 px-2 border-l-4 flex flex-col justify-center min-h-[54px] " + color}>
                <p className="text-[9px] font-black text-slate-400 leading-tight mb-0.5">${label}</p>
                <div className="text-base sm:text-lg font-black stat-value leading-none">${children}</div>
                ${sub && html`<p className="text-[9px] sm:text-[10px] font-bold leading-none mt-1">${sub}</p>`}
            </div>`;

        const App = () => {
            const name = ACCT ? ACCT.name : null;
            const [sessions, setSessions] = useState([]);
            const [snaps, setSnaps]       = useState([]);
            const [series, setSeries]     = useState({});   // 週 → data/series 存檔
            const [demo, setDemo]         = useState({});   // 週 → { market, series }
            const [vix, setVix]           = useState(null);
            const [viewWeek, setViewWeek] = useState('');
            const [sel, setSel]           = useState(null); // 盤 0~9、'week' = 整週、null = 最新一盤
            const [shown, setShownState]  = useState(loadShown);
            const setShown = v => { setShownState(v); saveShown(v); };
            const [updated, setUpdated]   = useState(null);
            const [official, setOfficial] = useState(null); // 週 → 試算表「歷史紀錄」的週績效（只有聯發哥有）
            const [loading, setLoading]   = useState(true);
            const [copied, setCopied]     = useState(false);

            // 橡皮擦：塗掉的點 = 試算表「塗掉紀錄」（隱藏分頁）＋這次在頁面上塗 / 還原的；只有輸入過密碼的瀏覽器看得到橡皮擦（第一次用 &edit=1 打開）
            // 一般人看到的圖不會有任何塗掉的痕跡：塗掉的點直接不畫，前後兩點連起來
            const [erased, setErased]       = useState(() => new Set());
            const [overrides, setOverrides] = useState(() => new Map());
            const [eraser, setEraser]       = useState(false);
            const [undoStack, setUndoStack] = useState([]);
            const [eraseMsg, setEraseMsg]   = useState('');
            const canErase = !!getEraseKey() || params.get('edit') === '1';
            const batch = useRef(new Map());
            const itemOf = (def, t) => ({ account: def.src === 'demo' ? '*' : name, line: def.key, t: stampOf(t) });
            const keyOf = it => eraseKey(it.account, it.line, it.t);
            const hidden = useCallback((def, t) => {
                const k = keyOf(itemOf(def, t));
                return overrides.has(k) ? overrides.get(k) : erased.has(k);
            }, [erased, overrides, name]);
            const mark = (items, value) => setOverrides(prev => { const m = new Map(prev); items.forEach(it => m.set(keyOf(it), value)); return m; });
            const postErase = async (items, action) => {
                try {
                    const r = await fetch(ERASE_API, { method: 'POST', body: JSON.stringify({ key: getEraseKey(), items: items.map(it => ({ ...it, action })) }) });
                    const j = await r.json();
                    if (!j.ok) {
                        if (j.error === '密碼錯誤') { setEraseKeyStore(''); setEraser(false); }
                        setEraseMsg(`沒有存到：${j.error}`); return;
                    }
                    setEraseMsg(`${action === 'erase' ? '已塗掉' : '已還原'} ${items.length} 點`);
                } catch (e) { setEraseMsg('沒有存到：連線失敗，請再試一次'); }
            };
            const onErase = found => {
                const add = [];
                found.forEach(({ def, t }) => { const it = itemOf(def, t), k = keyOf(it); if (!batch.current.has(k)) { batch.current.set(k, it); add.push(it); } });
                if (add.length) mark(add, true);
            };
            const onEraseEnd = () => {
                const items = [...batch.current.values()];
                batch.current = new Map();
                if (!items.length) return;
                setUndoStack(st => [...st, items]);
                postErase(items, 'erase');
            };
            const undo = () => {
                const items = undoStack[undoStack.length - 1];
                if (!items) return;
                setUndoStack(st => st.slice(0, -1));
                mark(items, false);
                postErase(items, 'restore');
            };
            // 密碼用頁面上的輸入框（有些瀏覽器不支援 window.prompt）
            const [askKey, setAskKey]     = useState(false);
            const [keyInput, setKeyInput] = useState('');
            const toggleEraser = () => {
                if (eraser) { setEraser(false); return; }
                if (!ERASE_API) { setEraseMsg('橡皮擦還沒設定好'); return; }
                if (!getEraseKey()) { setAskKey(v => !v); setEraseMsg(''); return; }
                setEraser(true);
                setEraseMsg('');
            };
            const submitKey = async e => {
                e.preventDefault();
                const key = keyInput.trim();
                if (!key) return;
                setEraseMsg('確認密碼中…');
                const r = await fetch(ERASE_API, { method: 'POST', body: JSON.stringify({ key, check: true }) }).then(x => x.json()).catch(() => null);
                if (!r || !r.ok) { setEraseMsg(r ? '密碼錯誤' : '連線失敗，請再試一次'); return; }
                setEraseKeyStore(key);
                setKeyInput('');
                setAskKey(false);
                setEraser(true);
                setEraseMsg('');
            };

            const currentWeek = snaps[0] ? snaps[0].week : slotAt(tpeNow()).week;
            const week = viewWeek || currentWeek;
            const isCurrent = week === currentWeek;

            const getJSON = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
            const getText = url => fetch(url).then(r => r.ok ? r.text() : '').catch(() => '');

            const loadLive = useCallback(async () => {
                const t = Date.now();
                const since = new Date(tpeNow().getTime() - 3 * 3600e3).toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/');
                const [s, sn, lg, v, er, h] = await Promise.all([getJSON(`${SESSIONS_URL}?t=${t}`), getText(`${SNAPS_URL}&t=${t}`), getText(`${LOG_URL(since)}&t=${t}`),
                                                                 getJSON(VIX_URL), getText(`${ERASE_LOG_URL}&t=${t}`), HISTORY_DIR ? getJSON(`${HISTORY_DIR}/sessions.json`) : null]);
                if (s) setSessions(withHistory(h && h.sessions, await fillMissing(s.sessions || [], slotAt(tpeNow()).week)));
                if (h && h.official) setOfficial(h.official);
                if (er) setErased(parseErasures(parseCSV(er)));
                if (sn || lg) setSnaps([...(lg ? parseLog(parseCSV(lg)) : []), ...(sn ? parseSnapshots(parseCSV(sn)) : [])].sort((a, b) => b.t - a.t));
                setVix(parseVix(v));
                setUpdated(new Date());
                setLoading(false);
            }, []);
            const loadWeek = useCallback(async (w, live) => {
                const t = Date.now();
                const [s, d, old] = await Promise.all([getJSON(`${SERIES_URL(w)}?t=${t}`), getText(live ? `${DEMO_URL}&t=${t}` : DEMO_HISTORY(w)),
                                                       HISTORY_DIR && w < HISTORY_UNTIL ? getJSON(`${HISTORY_DIR}/${w}.json`) : null]);
                setSeries(prev => ({ ...prev, [w]: s, [`history:${w}`]: old }));
                let parsed = d ? parseDemo(parseCSV(d), w) : null;
                if (!parsed && live) { const h = await getText(DEMO_HISTORY(w)); parsed = h ? parseDemo(parseCSV(h), w) : null; }
                // 補回的週沒有每週存檔可讀：期指、週三週五時價都在補回的檔案裡
                if (!parsed && old) parsed = { market: {}, series: old.t.map((ts, k) => ({ t: wallMs(ts), fut: old.fut[k], ba: old.ba[k], bb: old.bb[k] })) };
                setDemo(prev => ({ ...prev, [w]: parsed }));
            }, []);

            useEffect(() => {
                if (!name) return;
                document.title = `${name} 績效 · 歐大的投資報表`;
                loadLive();
                const timer = setInterval(loadLive, 60000);
                return () => clearInterval(timer);
            }, [name, loadLive]);
            useEffect(() => {
                if (!name) return;
                loadWeek(week, isCurrent);
                if (!isCurrent) return;
                const timer = setInterval(() => loadWeek(week, true), 120000);
                return () => clearInterval(timer);
            }, [name, week, isCurrent, loadWeek]);

            // 帳號頁單獨分享：不列出其他帳號
            if (!name) return html`
                <div className="max-w-xl mx-auto p-6">
                    <h1 className="text-2xl font-black text-slate-800">找不到這個帳號</h1>
                    <p className="text-sm font-bold text-slate-400 mt-2">請確認網址是否正確。</p>
                </div>`;

            // 該帳號本週走勢：存檔 + 試算表裡還留著的快照（同一時間以試算表為準）
            const acc = (() => {
                const map = new Map();
                [series[`history:${week}`], series[week]].forEach(s => {
                    if (!s || !s.acc || !s.acc[name]) return;
                    const a = s.acc[name];
                    s.t.forEach((ts, k) => {
                        if (a.pnl[k] === null) return;
                        const t = wallMs(ts);
                        map.set(t, { t, slot: slotAt(new Date(t)).slot, pnl: a.pnl[k], rate: a.rate[k], base: a.base[k], asset: a.asset[k], pts: a.pts[k], tv: a.tv[k], ratio: a.ratio[k], delta: a.delta[k], margin: a.margin[k] });
                    });
                });
                snaps.filter(x => x.week === week).forEach(x => {
                    const a = x.accounts.find(y => y.name === name);
                    if (a && a.pnl !== null) map.set(x.t, { ...a, t: x.t, slot: x.slot });
                });
                const pts = [...map.values()].sort((p, q) => p.t - q.t);
                // 週三夜盤起始資產重設前的點還是上週的累積，不畫
                const zero = pts.findIndex(p => p.slot === 0 && p.pnl === 0);
                return zero > 0 ? pts.filter((p, k) => k >= zero || p.slot !== 0) : pts;
            })();
            const demoWeek = demo[week] || null;
            const demoSeries = demoWeek && demoWeek.series ? despike(demoWeek.series, ['fut', 'ba', 'bb']) : [];

            const views = sessions.map(s => accountView(s, name)).filter(Boolean);
            const latestSnap = isCurrent && snaps[0] ? accountView(snaps[0], name) : null;
            const rows = buildWeek(week, views, latestSnap ? { ...latestSnap, live: true } : null, (demoWeek && demoWeek.market) || {}, isCurrent ? vix : null);
            const sum = summarize(rows);
            // 官方為主、推算為輔：週累積用官方；每盤獲利兩邊一樣不動；官方起算前的盤累積顯示「—」
            const off = official && !isCurrent ? official[week] || null : null;
            const offRows = !off ? rows : rows.map(r => {
                if (!r.state || r.pending) return r;
                const asset = r.state.total.base + r.state.total.pnl;
                if (sum.lastRow && r.i === sum.lastRow.i) return { ...r, cum: off.rate, state: { ...r.state, total: { ...r.state.total, pnl: off.pnl } } };
                return { ...r, cum: r.i >= off.from ? (asset - off.base) / off.base * 100 : null };
            });
            const ptsDef = SERIES_DEFS.find(s => s.key === 'pts');
            const trades = tradeStats(week, acc.filter(p => !hidden(ptsDef, p.t)), (demoWeek && demoWeek.series) || []);
            // 走勢圖的獲利 / 獲利率每盤從 0 起算：減掉上一盤收盤時的累積獲利（跟下方每盤績效表同一個基準）
            const accChart = (() => {
                const baseOf = {};
                return acc.map((p, k) => {
                    if (!(p.slot in baseOf)) {
                        const r = rows[p.slot], before = k ? acc[k - 1] : null;
                        baseOf[p.slot] = r && r.pnl !== undefined ? r.state.total.pnl - r.pnl : p.slot === 0 ? 0 : before ? before.pnl : p.pnl;
                    }
                    const spnl = p.pnl - baseOf[p.slot];
                    return { ...p, spnl, srate: p.base ? +(spnl / p.base * 100).toFixed(4) : null };
                });
            })();
            const weeks = [...new Set([currentWeek, ...sessions.map(s => s.week)])].sort().reverse();

            const autoSel = sum.lastRow ? sum.lastRow.i : (rows.find(r => r.live) || {}).i || 0;
            const cur = sel === null ? autoSel : sel;
            const wholeWeek = cur === 'week';
            const row = wholeWeek ? null : rows[cur];
            const range = wholeWeek ? [wallMs(slotOpen(week, 0)), wallMs(slotEnd(week, 9))] : [wallMs(slotOpen(week, cur)), wallMs(slotEnd(week, cur))];
            const last = acc[acc.length - 1] || null;
            const m = row ? row.market : {};
            const chgSub = r => r && r.many ? html`<span className=${r.chg >= 0 ? 'text-red-500' : 'text-emerald-500'}>${r.chg > 0 ? '+' : ''}${Math.round(r.chg).toLocaleString()} (${sgnPct(r.pct)})</span>` : null;
            const pick = i => { setSel(i); if (mobilePage === 2) setMobilePage(1); };   // 在第 2 頁點某一盤 → 回圖表

            const copyLink = () => {
                const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
                if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done).catch(() => {});
            };
            const shortUrl = `${location.host}${location.pathname}?id=${ACCT.id}`;

            return html`
                <div id="app-root" className="max-w-[1500px] mx-auto space-y-2 sm:space-y-3 p-1.5 sm:p-4">
                    <header className="glass-card px-3 sm:px-6 py-3 sm:py-4 flex flex-col sm:grid sm:grid-cols-[1fr_auto_1fr] items-center gap-3">
                        ${ACCT.home !== false
                            ? html`<a href="./" className="self-start sm:self-center sm:justify-self-start inline-flex items-center gap-1 px-3 py-2 rounded-lg bg-slate-900 text-yellow-400 font-black text-xs hover:bg-slate-800">← 總表</a>`
                            : html`<div className="hidden sm:block"></div>`}
                        <div className="text-center">
                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-slate-800 tracking-tighter">${name}<span className="text-slate-400 font-bold text-lg sm:text-2xl ml-2">即時績效</span></h1>
                            <div className="flex items-center justify-center gap-2 flex-wrap mt-1">
                                <span className="text-[10px] sm:text-xs font-bold text-slate-400 tracking-widest">歐大的投資報表 · 雙賣平衡</span>
                                ${isCurrent && html`<span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-emerald-50 text-[10px] font-bold text-emerald-600 live-indicator"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> LIVE</span>`}
                                <button onClick=${copyLink} title="複製這個帳號的網址" className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 text-[11px] font-bold max-w-full truncate">
                                    🔗 ${copied ? '已複製網址' : shortUrl}
                                </button>
                            </div>
                        </div>
                        <div className="flex sm:flex-col items-center sm:items-end sm:justify-self-end gap-2">
                            <span className="text-[10px] font-bold text-slate-400">${updated ? `更新 ${updated.toLocaleTimeString()}` : '--:--:--'}</span>
                            <button onClick=${() => { loadLive(); loadWeek(week, isCurrent); }} className="px-3 py-2 bg-slate-800 hover:bg-slate-900 active:scale-95 text-white rounded-lg font-bold text-xs">↻ 同步數據</button>
                        </div>
                    </header>

                    <div id="rotate-hint">
                        <svg className="rotate-hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                        <span>手機打橫看報表，字更大更清楚！</span>
                    </div>

                    <div id="stats-row" className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-1.5 sm:gap-2 text-center">
                        <${Stat} label=${off ? '本週獲利（官方）' : '本週獲利'} color="border-l-rose-500" sub=${off ? html`<span className=${toneOf(off.pnl)}>${sgnInt(off.pnl)}</span>${!off.same && sum.cum !== null ? html`<span className="text-slate-400"> · 推算 ${sgnPct(sum.cum)}</span>` : null}` : last && html`<span className=${toneOf(last.pnl)}>${sgnInt(last.pnl)}</span>`}>
                            ${off ? html`<span className=${toneOf(off.rate)}>${sgnPct(off.rate)}</span>` : html`<span className=${last ? toneOf(last.rate) : 'text-slate-300'}>${last && last.rate !== null ? sgnPct(last.rate) : '--'}</span>`}
                        <//>
                        <${Stat} label=${wholeWeek ? '本週勝敗' : `當盤績效（${row.def.label}）`} color="border-l-amber-500"
                                 sub=${row && row.pnl !== undefined && html`<span className=${toneOf(row.pnl)}>${sgnInt(row.pnl)}</span>`}>
                            ${wholeWeek ? html`<span><span className="text-red-600">${sum.win}勝</span> <span className="text-emerald-600">${sum.lose}敗</span></span>`
                              : row && row.rate !== undefined && row.rate !== null ? html`<span className=${toneOf(row.rate)}>${sgnPct(row.rate)}</span>` : html`<span className="text-slate-300">--</span>`}
                        <//>
                        <${Stat} label="百點震幅" color="border-l-blue-500"><span className="text-slate-800">${m.swing !== undefined ? fmtInt(m.swing) : '--'}</span><//>
                        <${Stat} label="週三時價 (BA)" color="border-l-red-500" sub=${chgSub(m.ba)}><span className="text-red-600">${m.ba ? fmtInt(m.ba.last) : '--'}</span><//>
                        <${Stat} label="週五時價 (BB)" color="border-l-green-500" sub=${chgSub(m.bb)}><span className="text-green-600">${m.bb ? fmtInt(m.bb.last) : '--'}</span><//>
                        <${Stat} label="資產" color="border-l-slate-500" sub=${last && last.base && html`<span className="text-slate-400">起始 ${fmtInt(last.base)}</span>`}><span className="text-slate-800">${last && last.asset ? fmtInt(last.asset) : '--'}</span><//>
                        <${Stat} label="保證金剩餘比率" color="border-l-indigo-500"><span className=${last && last.margin !== null && last.margin <= 40 ? 'text-red-600' : 'text-slate-800'}>${last && last.margin !== null ? `${last.margin}%` : '--'}</span><//>
                        <${Stat} label="買權比值 / 總點數" color="border-l-yellow-400" sub=${last && last.pts !== null && html`<span className="text-slate-500">總點數 ${fmtInt(last.pts)}</span>`}>
                            <span className="text-slate-800">${last && last.ratio !== null ? last.ratio.toFixed(2) : '--'}</span>
                        <//>
                    </div>

                    <div id="session-row" className="glass-card p-1 sm:p-1.5">
                        <div className="grid grid-cols-6 md:grid-cols-11 gap-1">
                            ${rows.map(r => {
                                const res = r.pending ? null : resultOf(r.pnl);
                                return html`
                                    <button key=${r.i} onClick=${() => pick(r.i)} className=${"session-btn" + (r.def.type === 'N' ? ' night' : '') + (cur === r.i ? ' active' : '')}>
                                        <span>${r.def.label}</span>
                                        <span className=${"text-[9px] leading-none " + (cur === r.i ? 'text-white/80' : res === 'win' ? 'text-red-600' : res === 'lose' ? 'text-emerald-600' : 'text-slate-300')}>
                                            ${res ? `${RESULT[res].text} ${sgnPct(r.rate)}` : r.state ? '進行中' : mdLabel(r.date)}
                                        </span>
                                    </button>`;
                            })}
                            <button onClick=${() => pick('week')} className=${"session-btn" + (wholeWeek ? ' active' : '')}><span>整週</span><span className="text-[9px] leading-none">${mdLabel(rows[0].date)}~${mdLabel(rows[9].date)}</span></button>
                        </div>
                    </div>

                    <div id="chart-card" className="glass-card p-2 md:p-4">
                        <${LinePicker} shown=${shown} setShown=${setShown} />
                        ${canErase && (() => {
                            // 這一段時間裡塗掉的點（本帳號＋市場資料）
                            const all = new Set(erased);
                            overrides.forEach((v, k) => v ? all.add(k) : all.delete(k));
                            const inRange = [...all].map(k => { const [account, line, t] = k.split('|'); return { account, line, t }; })
                                .filter(it => (it.account === name || it.account === '*') && wallMs(it.t) >= range[0] && wallMs(it.t) <= range[1]);
                            const restoreAll = () => { mark(inRange, false); postErase(inRange, 'restore'); };
                            return html`
                                <div className="flex flex-wrap items-center justify-center gap-2 mb-3 px-1">
                                    <button onClick=${toggleEraser} className=${"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border-2 text-xs font-black active:scale-95 " + (eraser ? 'bg-pink-600 border-pink-600 text-white' : 'bg-white border-pink-300 text-pink-600 hover:border-pink-500')}>
                                        🧽 ${eraser ? '橡皮擦開啟中（按一下關閉）' : '橡皮擦'}
                                    </button>
                                    ${askKey && !eraser && html`
                                        <form onSubmit=${submitKey} className="inline-flex items-center gap-1.5">
                                            <input type="password" autoFocus value=${keyInput} onInput=${e => setKeyInput(e.target.value)} placeholder="橡皮擦密碼"
                                                   className="w-32 px-3 py-1.5 rounded-full border-2 border-pink-300 text-xs font-bold focus:outline-none focus:border-pink-500" />
                                            <button type="submit" className="px-3 py-1.5 rounded-full text-xs font-black text-white bg-pink-600 hover:bg-pink-700">確定</button>
                                        </form>`}
                                    ${eraser && html`<span className="text-[11px] font-bold text-pink-600">在圖上按住拖曳，把不合理的點塗掉</span>`}
                                    ${undoStack.length > 0 && html`<button onClick=${undo} className="px-3 py-1.5 rounded-full text-xs font-black text-slate-600 bg-slate-100 hover:bg-slate-200">↶ 復原上一次</button>`}
                                    ${inRange.length > 0 && html`<button onClick=${restoreAll} className="px-3 py-1.5 rounded-full text-xs font-black text-slate-600 bg-slate-100 hover:bg-slate-200">還原這段塗掉的 ${inRange.length} 點</button>`}
                                    ${eraseMsg && html`<span className="text-[11px] font-bold text-slate-500">${eraseMsg}</span>`}
                                </div>`;
                        })()}
                        ${loading ? html`<div className="h-[440px] flex items-center justify-center text-slate-400 font-bold text-sm">資料同步中…</div>`
                                  : html`<${PerfChart} acc=${accChart} demo=${demoSeries} range=${range} shown=${shown} wholeWeek=${wholeWeek}
                                                     hidden=${hidden} eraser=${eraser} onErase=${onErase} onEraseEnd=${onEraseEnd} />`}
                        ${!loading && !acc.some(p => p.t >= range[0] && p.t <= range[1]) && html`<p className="text-center text-xs font-bold text-slate-400 -mt-2 pb-2">這一盤還沒有這個帳號的走勢資料</p>`}
                    </div>

                    <div id="page-session" className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                        <div className="bg-slate-900 px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1.5">
                            <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">每盤績效表<span className="text-white">${isCurrent ? '（本週）' : `（${mdLabel(week)} 週）`}</span></h2>
                            <span className="text-[10px] sm:text-[11px] font-bold text-slate-400">${weekSummary(rows, off ? { ...sum, cum: off.rate } : sum)}${off && !off.same && sum.cum !== null ? `（官方；推算 ${sgnPct(sum.cum)}）` : ''}</span>
                            <label className="ml-auto flex items-center gap-1.5 text-[10px] sm:text-[11px] font-bold text-slate-400">歷史週次
                                <select value=${viewWeek} onChange=${e => { setViewWeek(e.target.value); setSel(null); }} className="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-white cursor-pointer">
                                    ${weeks.map(w => html`<option key=${w} value=${w === currentWeek ? '' : w}>${w === currentWeek ? '本週（即時）' : `${mdLabel(w)} 週`}</option>`)}
                                </select>
                            </label>
                        </div>
                        <div id="win-strip"><${WinStrip} rows=${rows} selected=${cur} onPick=${pick} /></div>
                        <${SessionTable} rows=${offRows} showPersonal=${false} trades=${trades} selected=${cur} onPick=${pick} />
                        <p className="text-[10px] font-bold text-slate-400 px-3 sm:px-4 py-2">點任一盤可切換圖表。獲利率 = 該盤獲利 ÷ 本帳號起始資產；紅 = 賺、綠 = 賠。${HISTORY_DIR && week < HISTORY_UNTIL ? '這一週由下單程式的紀錄補回，每 2 分鐘一筆；週三、週五時價取自試算表與下單紀錄，缺的盤顯示「—」；VIX 取自期交所，只有 7 月起的資料；百點震幅是用紀錄裡的期指算的。' + (ACCT.id === 'mtk' ? '每盤獲利以下單紀錄為準，週三夜盤的出入金不算損益。' + (!off ? '這一週試算表「歷史紀錄」沒有資料，週累積以推算為準。' : off.same ? '週累積以試算表「歷史紀錄」為準，和推算相同。' : `週累積以試算表「歷史紀錄」為準（官方 ${sgnInt(off.pnl)}${off.start ? `，從 ${off.start} 起算，更早的盤不計入` : ''}）；推算從週首資產起算 ${sum.lastRow ? sgnInt(sum.lastRow.state.total.pnl) : '—'}（${sum.cum !== null ? sgnPct(sum.cum) : '—'}）。`) : '') : '帳號走勢每 2 分鐘一筆（10/29 前為每 10 分鐘）。'}<span className="sm:hidden">表格可左右滑動。</span></p>
                    </div>

                </div>`;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
</body>
</html>
