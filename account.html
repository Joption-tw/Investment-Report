<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>帳號績效 · 歐大的投資報表</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="common.js?v=20261029c"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        html, body { margin: 0; background-color: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Noto Sans TC', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono-data, .stat-value { font-family: Arial, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.98); border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0 !important; }
        #performance-chart { height: 440px; width: 100%; }
        @media (min-width: 768px) { #performance-chart { height: 560px; } }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .session-btn { width: 100%; padding: 0.45rem 0.25rem; border-radius: 0.4rem; font-size: 11px; font-weight: 800; border: 1px solid #e2e8f0;
                       background: white; color: #64748b; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; user-select: none; transition: all 150ms; }
        .session-btn.active { background: #f97316; color: white; border-color: #ea580c; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.2); }
        .session-btn.night.active { background: #1e293b; border-color: #0f172a; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .live-indicator { animation: pulse-soft 2s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;">
            <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#eab308;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="font-family:'Noto Sans TC',sans-serif;color:#64748b;margin:0;">載入中，請稍候…</p>
        </div>
    </div>
    <script>
        // 單一帳號的績效頁：account.html?id=<代號>（代號見 common.js 的 ACCOUNTS），版面參考 sample（示範帳戶即時績效）
        // 走勢：該帳號每 2 分鐘的「兩分鐘紀錄」＋績效表每 10 分鐘的快照（試算表只留最近的，更早的由 GitHub Actions 存到 data/series/<週>.json）
        //       期指 / 週三、週五時價取自示範帳戶試算表（每 2 分鐘）
        const { useState, useEffect, useCallback, useRef } = React;
        const params = new URLSearchParams(location.search);
        const ACCT = ACCOUNTS.find(a => a.id === params.get('id')) || accountOf(params.get('name'));

        // 走勢圖每一條線都可以自己開關；同一個軸的線共用刻度，只有畫出來的線的軸才顯示
        const AXES = {
            fut:    { name: '期指',   side: 'left',  color: '#2563eb', scale: true },
            pts:    { name: '總點',   side: 'left',  color: '#475569', min: 0 },
            rate:   { name: '獲利%',  side: 'right', color: '#e11d48', scale: true, fmt: v => `${v}%` },
            pnl:    { name: '獲利',   side: 'right', color: '#d97706', scale: true },
            price:  { name: '時價',   side: 'right', color: '#9333ea', scale: true },
            ratio:  { name: '比值',   side: 'right', color: '#ca8a04', min: 0, max: 1 },
            margin: { name: '剩餘%',  side: 'right', color: '#6366f1', min: 0, max: 100, fmt: v => `${v}%` }
        };
        const AXIS_KEYS = Object.keys(AXES);
        // 線的樣式跟 sample 網站一樣：平滑、2.2 粗、淡陰影；獲利率只畫漸層面積；最高 / 最低點標數字（peak）
        const SERIES_DEFS = [
            { key: 'fut',    label: '期指',           axis: 'fut',    color: '#2563eb', src: 'demo', z: 5, peak: { max: '#ef4444', min: '#10b981', bold: true } },
            { key: 'pts',    label: '總點數',         axis: 'pts',    color: '#334155', src: 'acc',  z: 5, peak: { max: '#64748b' } },
            { key: 'rate',   label: '獲利率',         axis: 'rate',   color: '#e11d48', src: 'acc',  z: 1, area: true, unit: '%', d: 2, peak: { max: '#22d3ee', min: '#ec4899', bold: true } },
            { key: 'pnl',    label: '獲利金額',       axis: 'pnl',    color: '#d97706', src: 'acc',  z: 3 },
            { key: 'ba',     label: '週三時價',       axis: 'price',  color: '#ef4444', src: 'demo', z: 4, peak: { max: '#ef4444' } },
            { key: 'bb',     label: '週五時價',       axis: 'price',  color: '#10b981', src: 'demo', z: 4, peak: { max: '#10b981' } },
            { key: 'ratio',  label: '買權比值',       axis: 'ratio',  color: '#ca8a04', src: 'acc',  z: 3, d: 2 },
            { key: 'margin', label: '保證金剩餘比率', axis: 'margin', color: '#6366f1', src: 'acc',  z: 3, unit: '%' }
        ];
        const peakPoints = (s, fmt) => {
            if (!s.peak) return undefined;
            const label = (color, position, offset) => ({ color, position, offset, formatter: p => fmt(p.value, s) });
            return { symbol: 'circle', symbolSize: 0, label: { show: true, fontSize: 10, fontWeight: s.peak.bold ? 'bold' : 'normal' },
                     data: [s.peak.max && { type: 'max', label: label(s.peak.max, 'top', [0, -5]) },
                            s.peak.min && { type: 'min', label: label(s.peak.min, 'bottom', [0, 5]) }].filter(Boolean) };
        };
        const DEFAULT_SHOWN = ['pts', 'rate', 'ba', 'bb'];
        const SHOWN_KEY = 'ir-account-chart-lines';
        const loadShown = () => {
            try { const v = JSON.parse(localStorage.getItem(SHOWN_KEY)); if (Array.isArray(v)) return v.filter(k => SERIES_DEFS.some(s => s.key === k)); } catch (e) {}
            return DEFAULT_SHOWN;
        };
        const saveShown = v => { try { localStorage.setItem(SHOWN_KEY, JSON.stringify(v)); } catch (e) {} };

        // 橡皮擦開著時：在圖上按住拖曳，游標 16px 內的點都塗掉（onErase），放開時送出（onEraseEnd）
        const ERASE_KEY_STORE = 'ir-erase-key';
        const getEraseKey = () => { try { return localStorage.getItem(ERASE_KEY_STORE) || ''; } catch (e) { return ''; } };
        const setEraseKeyStore = v => { try { v ? localStorage.setItem(ERASE_KEY_STORE, v) : localStorage.removeItem(ERASE_KEY_STORE); } catch (e) {} };

        const PerfChart = ({ acc, demo, range, shown, wholeWeek, hidden, eraser, onErase, onEraseEnd }) => {
            const ref = useRef(null), chart = useRef(null), drawn = useRef([]), lastRange = useRef(null);
            const live = useRef({});
            live.current = { eraser, onErase, onEraseEnd };
            useEffect(() => {
                const c = chart.current = echarts.init(ref.current);
                const onResize = () => c.resize();
                window.addEventListener('resize', onResize);
                let painting = false;
                const eraseAt = (x, y) => {
                    const R = 16, t0 = c.convertFromPixel({ xAxisIndex: 0 }, x - R), t1 = c.convertFromPixel({ xAxisIndex: 0 }, x + R);
                    const found = [];
                    drawn.current.forEach(d => d.points.forEach(([t, v]) => {
                        if (t < t0 || t > t1 || v === null || v === undefined) return;
                        const [px, py] = c.convertToPixel({ seriesIndex: d.seriesIndex }, [t, v]);
                        if (Math.hypot(px - x, py - y) <= R) found.push({ def: d.def, t });
                    }));
                    if (found.length) live.current.onErase(found);
                };
                const zr = c.getZr();
                zr.on('mousedown', e => { if (!live.current.eraser) return; painting = true; eraseAt(e.offsetX, e.offsetY); });
                zr.on('mousemove', e => { if (painting) eraseAt(e.offsetX, e.offsetY); });
                const end = () => { if (painting) { painting = false; live.current.onEraseEnd(); } };
                zr.on('mouseup', end);
                zr.on('globalout', end);
                return () => { window.removeEventListener('resize', onResize); c.dispose(); };
            }, []);
            useEffect(() => {
                const [min, max] = range;
                // 同一個時間範圍重畫（塗掉、開關線）時保留目前的縮放
                let zoom = [0, 100];
                const rk = `${min}-${max}`;
                if (lastRange.current === rk) { const dz = (chart.current.getOption().dataZoom || [])[1]; if (dz) zoom = [dz.start, dz.end]; }
                lastRange.current = rk;
                const src = { acc: acc.filter(p => p.t >= min && p.t <= max), demo: demo.filter(p => p.t >= min && p.t <= max) };
                const on = SERIES_DEFS.filter(s => shown.includes(s.key));
                const used = AXIS_KEYS.filter(k => on.some(s => s.axis === k));
                // 手機寬度不夠：每邊只顯示一個軸的刻度（其他線一樣用自己的刻度畫）
                const usedAxes = window.innerWidth < 768 ? used.filter(k => used.find(x => AXES[x].side === AXES[k].side) === k) : used;
                const offsetOf = {}, count = { left: 0, right: 0 };
                usedAxes.forEach(k => { offsetOf[k] = count[AXES[k].side]++ * 55; });
                const byName = Object.fromEntries(SERIES_DEFS.map(s => [s.label, s]));
                // 每條線：拿掉塗掉的點 → 過濾跳點（示範帳戶資料在上層已過濾）→ 跟前後兩點平均，跟 sample 一樣
                const lines = SERIES_DEFS.map((s, i) => {
                    if (!shown.includes(s.key)) return { def: s, seriesIndex: i, points: [] };
                    let pts = src[s.src].filter(p => !hidden(s, p.t));
                    if (s.src === 'acc') pts = despike(pts, [s.key]);
                    return { def: s, seriesIndex: i, points: smooth3(pts.map(p => [p.t, p[s.key]])) };
                });
                const fmt = (v, s) => v === null || v === undefined ? '—' : s && s.d ? `${v.toFixed(s.d)}${s.unit || ''}` : `${Math.round(v).toLocaleString()}${s && s.unit || ''}`;
                chart.current.setOption({
                    animation: false,
                    textStyle: { fontFamily: 'Arial' },
                    grid: { left: count.left * 55 + 15, right: count.right * 55 + 15, top: 30, bottom: 70 },
                    tooltip: { show: !eraser, trigger: 'axis', axisPointer: { type: 'line' }, confine: true,
                        formatter: ps => ps.length ? `<b>${mdhm(ps[0].value[0])}</b><br>` + ps.map(p => `${p.marker}${p.seriesName}：<b>${fmt(p.value[1], byName[p.seriesName])}</b>`).join('<br>') : '' },
                    xAxis: { type: 'time', min, max, splitLine: { show: false },
                        axisLabel: { hideOverlap: true, color: '#64748b', fontWeight: 'bold', formatter: v => wholeWeek ? mdhm(v).replace(' ', '\n') : hhmm(v) } },
                    yAxis: AXIS_KEYS.map(k => {
                        const a = AXES[k], first = usedAxes[0] === k;
                        return { type: 'value', name: a.name, position: a.side, offset: offsetOf[k] || 0, show: usedAxes.includes(k),
                                 scale: !!a.scale, min: a.min, max: a.max,
                                 axisLabel: { color: a.color, fontWeight: 'bold', fontSize: 10, formatter: a.fmt },
                                 splitLine: first ? { lineStyle: { type: 'dashed', color: '#f1f5f9' } } : { show: false } };
                    }),
                    dataZoom: [
                        // 滾輪留給頁面捲動：電腦按住 Ctrl + 滾輪縮放、拖曳平移；手機只用下方拉桿
                        { type: 'inside', xAxisIndex: 0, start: zoom[0], end: zoom[1], filterMode: 'none', disabled: eraser || window.innerWidth < 768,
                          zoomOnMouseWheel: 'ctrl', moveOnMouseWheel: false, moveOnMouseMove: true },
                        { type: 'slider', xAxisIndex: 0, start: zoom[0], end: zoom[1], filterMode: 'none', bottom: 8, height: 24, showDetail: false, brushSelect: false }
                    ],
                    series: lines.map(({ def: s, points: data }) => {
                        return {
                            name: s.label, type: 'line', yAxisIndex: AXIS_KEYS.indexOf(s.axis), data, connectNulls: true,
                            smooth: true, showSymbol: false, z: s.z,
                            lineStyle: { width: s.area ? 0 : 2.2, color: s.color, shadowBlur: 3 }, itemStyle: { color: s.color }, emphasis: { disabled: true },
                            areaStyle: s.area ? { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(225, 29, 72, 0.7)' }, { offset: 1, color: 'rgba(225, 29, 72, 0.05)' }]) } : undefined,
                            markPoint: data.length ? peakPoints(s, fmt) : undefined,
                            markLine: s.key === 'rate' && data.length ? { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: '#cbd5e1', type: 'solid' }, data: [{ yAxis: 0 }] } : undefined
                        };
                    })
                }, true);
                drawn.current = lines;
            }, [acc, demo, range, shown, wholeWeek, hidden, eraser]);
            return html`<div id="performance-chart" ref=${ref} style=${eraser ? { cursor: 'crosshair', touchAction: 'none' } : undefined}></div>`;
        };

        // 走勢圖上方的開關：每一條線一顆，點了就顯示 / 隱藏
        const LinePicker = ({ shown, setShown }) => {
            const toggle = k => setShown(shown.includes(k) ? shown.filter(x => x !== k) : [...shown, k]);
            return html`
                <div className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mb-3 px-1">
                    <span className="w-full sm:w-auto text-center text-[10px] font-black text-slate-400 sm:mr-1">點選要看的線：</span>
                    ${SERIES_DEFS.map(s => {
                        const on = shown.includes(s.key);
                        return html`
                            <button key=${s.key} onClick=${() => toggle(s.key)} aria-pressed=${on}
                                    className=${"inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full border-2 text-[11px] sm:text-xs font-black transition-all active:scale-95 " + (on ? 'text-white shadow-sm' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-400')}
                                    style=${on ? { background: s.color, borderColor: s.color } : undefined}>
                                <span className="w-2.5 h-2.5 rounded-full border-2" style=${{ borderColor: on ? 'white' : s.color, background: on ? 'white' : 'transparent' }}></span>
                                ${s.label}
                            </button>`;
                    })}
                    <span className="flex gap-1.5">
                        <button onClick=${() => setShown(SERIES_DEFS.map(s => s.key))} className="px-2.5 py-1.5 rounded-full text-[11px] font-black text-slate-500 bg-slate-100 hover:bg-slate-200">全部</button>
                        <button onClick=${() => setShown(DEFAULT_SHOWN)} className="px-2.5 py-1.5 rounded-full text-[11px] font-black text-slate-500 bg-slate-100 hover:bg-slate-200">預設</button>
                    </span>
                </div>`;
        };

        const Stat = ({ label, color, children, sub }) => html`
            <div className=${"glass-card py-1.5 px-2 border-l-4 flex flex-col justify-center min-h-[54px] " + color}>
                <p className="text-[9px] font-black text-slate-400 leading-tight mb-0.5">${label}</p>
                <div className="text-base sm:text-lg font-black stat-value leading-none">${children}</div>
                ${sub && html`<p className="text-[9px] sm:text-[10px] font-bold leading-none mt-1">${sub}</p>`}
            </div>`;

        const App = () => {
            const name = ACCT ? ACCT.name : null;
            const [sessions, setSessions] = useState([]);
            const [snaps, setSnaps]       = useState([]);
            const [series, setSeries]     = useState({});   // 週 → data/series 存檔
            const [demo, setDemo]         = useState({});   // 週 → { market, series }
            const [vix, setVix]           = useState(null);
            const [viewWeek, setViewWeek] = useState('');
            const [sel, setSel]           = useState(null); // 盤 0~9、'week' = 整週、null = 最新一盤
            const [shown, setShownState]  = useState(loadShown);
            const setShown = v => { setShownState(v); saveShown(v); };
            const [updated, setUpdated]   = useState(null);
            const [loading, setLoading]   = useState(true);
            const [copied, setCopied]     = useState(false);

            // 橡皮擦：塗掉的點 = 試算表「塗掉紀錄」（隱藏分頁）＋這次在頁面上塗 / 還原的；只有輸入過密碼的瀏覽器看得到橡皮擦（第一次用 &edit=1 打開）
            // 一般人看到的圖不會有任何塗掉的痕跡：塗掉的點直接不畫，前後兩點連起來
            const [erased, setErased]       = useState(() => new Set());
            const [overrides, setOverrides] = useState(() => new Map());
            const [eraser, setEraser]       = useState(false);
            const [undoStack, setUndoStack] = useState([]);
            const [eraseMsg, setEraseMsg]   = useState('');
            const canErase = !!getEraseKey() || params.get('edit') === '1';
            const batch = useRef(new Map());
            const itemOf = (def, t) => ({ account: def.src === 'demo' ? '*' : name, line: def.key, t: stampOf(t) });
            const keyOf = it => eraseKey(it.account, it.line, it.t);
            const hidden = useCallback((def, t) => {
                const k = keyOf(itemOf(def, t));
                return overrides.has(k) ? overrides.get(k) : erased.has(k);
            }, [erased, overrides, name]);
            const mark = (items, value) => setOverrides(prev => { const m = new Map(prev); items.forEach(it => m.set(keyOf(it), value)); return m; });
            const postErase = async (items, action) => {
                try {
                    const r = await fetch(ERASE_API, { method: 'POST', body: JSON.stringify({ key: getEraseKey(), items: items.map(it => ({ ...it, action })) }) });
                    const j = await r.json();
                    if (!j.ok) {
                        if (j.error === '密碼錯誤') { setEraseKeyStore(''); setEraser(false); }
                        setEraseMsg(`沒有存到：${j.error}`); return;
                    }
                    setEraseMsg(`${action === 'erase' ? '已塗掉' : '已還原'} ${items.length} 點`);
                } catch (e) { setEraseMsg('沒有存到：連線失敗，請再試一次'); }
            };
            const onErase = found => {
                const add = [];
                found.forEach(({ def, t }) => { const it = itemOf(def, t), k = keyOf(it); if (!batch.current.has(k)) { batch.current.set(k, it); add.push(it); } });
                if (add.length) mark(add, true);
            };
            const onEraseEnd = () => {
                const items = [...batch.current.values()];
                batch.current = new Map();
                if (!items.length) return;
                setUndoStack(st => [...st, items]);
                postErase(items, 'erase');
            };
            const undo = () => {
                const items = undoStack[undoStack.length - 1];
                if (!items) return;
                setUndoStack(st => st.slice(0, -1));
                mark(items, false);
                postErase(items, 'restore');
            };
            // 密碼用頁面上的輸入框（有些瀏覽器不支援 window.prompt）
            const [askKey, setAskKey]     = useState(false);
            const [keyInput, setKeyInput] = useState('');
            const toggleEraser = () => {
                if (eraser) { setEraser(false); return; }
                if (!ERASE_API) { setEraseMsg('橡皮擦還沒設定好'); return; }
                if (!getEraseKey()) { setAskKey(v => !v); setEraseMsg(''); return; }
                setEraser(true);
                setEraseMsg('');
            };
            const submitKey = async e => {
                e.preventDefault();
                const key = keyInput.trim();
                if (!key) return;
                setEraseMsg('確認密碼中…');
                const r = await fetch(ERASE_API, { method: 'POST', body: JSON.stringify({ key, check: true }) }).then(x => x.json()).catch(() => null);
                if (!r || !r.ok) { setEraseMsg(r ? '密碼錯誤' : '連線失敗，請再試一次'); return; }
                setEraseKeyStore(key);
                setKeyInput('');
                setAskKey(false);
                setEraser(true);
                setEraseMsg('');
            };

            const currentWeek = snaps[0] ? snaps[0].week : slotAt(tpeNow()).week;
            const week = viewWeek || currentWeek;
            const isCurrent = week === currentWeek;

            const getJSON = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
            const getText = url => fetch(url).then(r => r.ok ? r.text() : '').catch(() => '');

            const loadLive = useCallback(async () => {
                const t = Date.now();
                const since = new Date(tpeNow().getTime() - 3 * 3600e3).toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/');
                const [s, sn, lg, v, er] = await Promise.all([getJSON(`${SESSIONS_URL}?t=${t}`), getText(`${SNAPS_URL}&t=${t}`), getText(`${LOG_URL(since)}&t=${t}`),
                                                              getJSON(VIX_URL), getText(`${ERASE_LOG_URL}&t=${t}`)]);
                if (s) setSessions(await fillMissing(s.sessions || [], slotAt(tpeNow()).week));
                if (er) setErased(parseErasures(parseCSV(er)));
                if (sn || lg) setSnaps([...(lg ? parseLog(parseCSV(lg)) : []), ...(sn ? parseSnapshots(parseCSV(sn)) : [])].sort((a, b) => b.t - a.t));
                setVix(parseVix(v));
                setUpdated(new Date());
                setLoading(false);
            }, []);
            const loadWeek = useCallback(async (w, live) => {
                const t = Date.now();
                const [s, d] = await Promise.all([getJSON(`${SERIES_URL(w)}?t=${t}`), getText(live ? `${DEMO_URL}&t=${t}` : DEMO_HISTORY(w))]);
                setSeries(prev => ({ ...prev, [w]: s }));
                let parsed = d ? parseDemo(parseCSV(d), w) : null;
                if (!parsed && live) { const h = await getText(DEMO_HISTORY(w)); parsed = h ? parseDemo(parseCSV(h), w) : null; }
                setDemo(prev => ({ ...prev, [w]: parsed }));
            }, []);

            useEffect(() => {
                if (!name) return;
                document.title = `${name} 績效 · 歐大的投資報表`;
                loadLive();
                const timer = setInterval(loadLive, 60000);
                return () => clearInterval(timer);
            }, [name, loadLive]);
            useEffect(() => {
                if (!name) return;
                loadWeek(week, isCurrent);
                if (!isCurrent) return;
                const timer = setInterval(() => loadWeek(week, true), 120000);
                return () => clearInterval(timer);
            }, [name, week, isCurrent, loadWeek]);

            // 帳號頁單獨分享：不列出其他帳號
            if (!name) return html`
                <div className="max-w-xl mx-auto p-6">
                    <h1 className="text-2xl font-black text-slate-800">找不到這個帳號</h1>
                    <p className="text-sm font-bold text-slate-400 mt-2">請確認網址是否正確。</p>
                </div>`;

            // 該帳號本週走勢：存檔 + 試算表裡還留著的快照（同一時間以試算表為準）
            const acc = (() => {
                const map = new Map();
                const s = series[week];
                if (s && s.acc && s.acc[name]) {
                    const a = s.acc[name];
                    s.t.forEach((ts, k) => {
                        if (a.pnl[k] === null) return;
                        const t = wallMs(ts);
                        map.set(t, { t, slot: slotAt(new Date(t)).slot, pnl: a.pnl[k], rate: a.rate[k], base: a.base[k], asset: a.asset[k], pts: a.pts[k], tv: a.tv[k], ratio: a.ratio[k], delta: a.delta[k], margin: a.margin[k] });
                    });
                }
                snaps.filter(x => x.week === week).forEach(x => {
                    const a = x.accounts.find(y => y.name === name);
                    if (a && a.pnl !== null) map.set(x.t, { ...a, t: x.t, slot: x.slot });
                });
                const pts = [...map.values()].sort((p, q) => p.t - q.t);
                // 週三夜盤起始資產重設前的點還是上週的累積，不畫
                const zero = pts.findIndex(p => p.slot === 0 && p.pnl === 0);
                return zero > 0 ? pts.filter((p, k) => k >= zero || p.slot !== 0) : pts;
            })();
            const demoWeek = demo[week] || null;
            const demoSeries = demoWeek && demoWeek.series ? despike(demoWeek.series, ['fut', 'ba', 'bb']) : [];

            const views = sessions.map(s => accountView(s, name)).filter(Boolean);
            const latestSnap = isCurrent && snaps[0] ? accountView(snaps[0], name) : null;
            const rows = buildWeek(week, views, latestSnap ? { ...latestSnap, live: true } : null, (demoWeek && demoWeek.market) || {}, isCurrent ? vix : null);
            const sum = summarize(rows);
            const weeks = [...new Set([currentWeek, ...sessions.map(s => s.week)])].sort().reverse();

            const autoSel = sum.lastRow ? sum.lastRow.i : (rows.find(r => r.live) || {}).i || 0;
            const cur = sel === null ? autoSel : sel;
            const wholeWeek = cur === 'week';
            const row = wholeWeek ? null : rows[cur];
            const range = wholeWeek ? [wallMs(slotOpen(week, 0)), wallMs(slotEnd(week, 9))] : [wallMs(slotOpen(week, cur)), wallMs(slotEnd(week, cur))];
            const last = acc[acc.length - 1] || null;
            const m = row ? row.market : {};
            const chgSub = r => r && r.many ? html`<span className=${r.chg >= 0 ? 'text-red-500' : 'text-emerald-500'}>${r.chg > 0 ? '+' : ''}${Math.round(r.chg).toLocaleString()} (${sgnPct(r.pct)})</span>` : null;
            const pick = i => setSel(i);

            const copyLink = () => {
                const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
                if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done).catch(() => {});
            };
            const shortUrl = `${location.host}${location.pathname}?id=${ACCT.id}`;

            return html`
                <div className="max-w-[1500px] mx-auto space-y-2 sm:space-y-3 p-1.5 sm:p-4">
                    <header className="glass-card px-3 sm:px-6 py-3 sm:py-4 flex flex-col sm:grid sm:grid-cols-[1fr_auto_1fr] items-center gap-3">
                        ${ACCT.home !== false
                            ? html`<a href="./" className="self-start sm:self-center sm:justify-self-start inline-flex items-center gap-1 px-3 py-2 rounded-lg bg-slate-900 text-yellow-400 font-black text-xs hover:bg-slate-800">← 總表</a>`
                            : html`<div className="hidden sm:block"></div>`}
                        <div className="text-center">
                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-slate-800 tracking-tighter">${name}<span className="text-slate-400 font-bold text-lg sm:text-2xl ml-2">即時績效</span></h1>
                            <div className="flex items-center justify-center gap-2 flex-wrap mt-1">
                                <span className="text-[10px] sm:text-xs font-bold text-slate-400 tracking-widest">歐大的投資報表 · 雙賣平衡</span>
                                ${isCurrent && html`<span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-emerald-50 text-[10px] font-bold text-emerald-600 live-indicator"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> LIVE</span>`}
                                <button onClick=${copyLink} title="複製這個帳號的網址" className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 text-[11px] font-bold max-w-full truncate">
                                    🔗 ${copied ? '已複製網址' : shortUrl}
                                </button>
                            </div>
                        </div>
                        <div className="flex sm:flex-col items-center sm:items-end sm:justify-self-end gap-2">
                            <span className="text-[10px] font-bold text-slate-400">${updated ? `更新 ${updated.toLocaleTimeString()}` : '--:--:--'}</span>
                            <button onClick=${() => { loadLive(); loadWeek(week, isCurrent); }} className="px-3 py-2 bg-slate-800 hover:bg-slate-900 active:scale-95 text-white rounded-lg font-bold text-xs">↻ 同步數據</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-1.5 sm:gap-2 text-center">
                        <${Stat} label="本週獲利" color="border-l-rose-500" sub=${last && html`<span className=${toneOf(last.pnl)}>${sgnInt(last.pnl)}</span>`}>
                            <span className=${last ? toneOf(last.rate) : 'text-slate-300'}>${last && last.rate !== null ? sgnPct(last.rate) : '--'}</span>
                        <//>
                        <${Stat} label=${wholeWeek ? '本週勝敗' : `當盤績效（${row.def.label}）`} color="border-l-amber-500"
                                 sub=${row && row.pnl !== undefined && html`<span className=${toneOf(row.pnl)}>${sgnInt(row.pnl)}</span>`}>
                            ${wholeWeek ? html`<span><span className="text-red-600">${sum.win}勝</span> <span className="text-emerald-600">${sum.lose}敗</span></span>`
                              : row && row.rate !== undefined && row.rate !== null ? html`<span className=${toneOf(row.rate)}>${sgnPct(row.rate)}</span>` : html`<span className="text-slate-300">--</span>`}
                        <//>
                        <${Stat} label="百點震幅" color="border-l-blue-500"><span className="text-slate-800">${m.swing !== undefined ? fmtInt(m.swing) : '--'}</span><//>
                        <${Stat} label="週三時價 (BA)" color="border-l-red-500" sub=${chgSub(m.ba)}><span className="text-red-600">${m.ba ? fmtInt(m.ba.last) : '--'}</span><//>
                        <${Stat} label="週五時價 (BB)" color="border-l-green-500" sub=${chgSub(m.bb)}><span className="text-green-600">${m.bb ? fmtInt(m.bb.last) : '--'}</span><//>
                        <${Stat} label="資產" color="border-l-slate-500" sub=${last && last.base && html`<span className="text-slate-400">起始 ${fmtInt(last.base)}</span>`}><span className="text-slate-800">${last && last.asset ? fmtInt(last.asset) : '--'}</span><//>
                        <${Stat} label="保證金剩餘比率" color="border-l-indigo-500"><span className=${last && last.margin !== null && last.margin <= 40 ? 'text-red-600' : 'text-slate-800'}>${last && last.margin !== null ? `${last.margin}%` : '--'}</span><//>
                        <${Stat} label="買權比值 / 總點數" color="border-l-yellow-400" sub=${last && last.pts !== null && html`<span className="text-slate-500">總點數 ${fmtInt(last.pts)}</span>`}>
                            <span className="text-slate-800">${last && last.ratio !== null ? last.ratio.toFixed(2) : '--'}</span>
                        <//>
                    </div>

                    <div className="glass-card p-1 sm:p-1.5">
                        <div className="grid grid-cols-6 md:grid-cols-11 gap-1">
                            ${rows.map(r => {
                                const res = r.pending ? null : resultOf(r.pnl);
                                return html`
                                    <button key=${r.i} onClick=${() => pick(r.i)} className=${"session-btn" + (r.def.type === 'N' ? ' night' : '') + (cur === r.i ? ' active' : '')}>
                                        <span>${r.def.label}</span>
                                        <span className=${"text-[9px] leading-none " + (cur === r.i ? 'text-white/80' : res === 'win' ? 'text-red-600' : res === 'lose' ? 'text-emerald-600' : 'text-slate-300')}>
                                            ${res ? `${RESULT[res].text} ${sgnPct(r.rate)}` : r.state ? '進行中' : mdLabel(r.date)}
                                        </span>
                                    </button>`;
                            })}
                            <button onClick=${() => pick('week')} className=${"session-btn" + (wholeWeek ? ' active' : '')}><span>整週</span><span className="text-[9px] leading-none">${mdLabel(rows[0].date)}~${mdLabel(rows[9].date)}</span></button>
                        </div>
                    </div>

                    <div className="glass-card p-2 md:p-4">
                        <${LinePicker} shown=${shown} setShown=${setShown} />
                        ${canErase && (() => {
                            // 這一段時間裡塗掉的點（本帳號＋市場資料）
                            const all = new Set(erased);
                            overrides.forEach((v, k) => v ? all.add(k) : all.delete(k));
                            const inRange = [...all].map(k => { const [account, line, t] = k.split('|'); return { account, line, t }; })
                                .filter(it => (it.account === name || it.account === '*') && wallMs(it.t) >= range[0] && wallMs(it.t) <= range[1]);
                            const restoreAll = () => { mark(inRange, false); postErase(inRange, 'restore'); };
                            return html`
                                <div className="flex flex-wrap items-center justify-center gap-2 mb-3 px-1">
                                    <button onClick=${toggleEraser} className=${"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border-2 text-xs font-black active:scale-95 " + (eraser ? 'bg-pink-600 border-pink-600 text-white' : 'bg-white border-pink-300 text-pink-600 hover:border-pink-500')}>
                                        🧽 ${eraser ? '橡皮擦開啟中（按一下關閉）' : '橡皮擦'}
                                    </button>
                                    ${askKey && !eraser && html`
                                        <form onSubmit=${submitKey} className="inline-flex items-center gap-1.5">
                                            <input type="password" autoFocus value=${keyInput} onInput=${e => setKeyInput(e.target.value)} placeholder="橡皮擦密碼"
                                                   className="w-32 px-3 py-1.5 rounded-full border-2 border-pink-300 text-xs font-bold focus:outline-none focus:border-pink-500" />
                                            <button type="submit" className="px-3 py-1.5 rounded-full text-xs font-black text-white bg-pink-600 hover:bg-pink-700">確定</button>
                                        </form>`}
                                    ${eraser && html`<span className="text-[11px] font-bold text-pink-600">在圖上按住拖曳，把不合理的點塗掉</span>`}
                                    ${undoStack.length > 0 && html`<button onClick=${undo} className="px-3 py-1.5 rounded-full text-xs font-black text-slate-600 bg-slate-100 hover:bg-slate-200">↶ 復原上一次</button>`}
                                    ${inRange.length > 0 && html`<button onClick=${restoreAll} className="px-3 py-1.5 rounded-full text-xs font-black text-slate-600 bg-slate-100 hover:bg-slate-200">還原這段塗掉的 ${inRange.length} 點</button>`}
                                    ${eraseMsg && html`<span className="text-[11px] font-bold text-slate-500">${eraseMsg}</span>`}
                                </div>`;
                        })()}
                        ${loading ? html`<div className="h-[440px] flex items-center justify-center text-slate-400 font-bold text-sm">資料同步中…</div>`
                                  : html`<${PerfChart} acc=${acc} demo=${demoSeries} range=${range} shown=${shown} wholeWeek=${wholeWeek}
                                                     hidden=${hidden} eraser=${eraser} onErase=${onErase} onEraseEnd=${onEraseEnd} />`}
                        ${!loading && !acc.some(p => p.t >= range[0] && p.t <= range[1]) && html`<p className="text-center text-xs font-bold text-slate-400 -mt-2 pb-2">這一盤還沒有這個帳號的走勢資料</p>`}
                    </div>

                    <div className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                        <div className="bg-slate-900 px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1.5">
                            <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">每盤績效表<span className="text-white">${isCurrent ? '（本週）' : `（${mdLabel(week)} 週）`}</span></h2>
                            <span className="text-[10px] sm:text-[11px] font-bold text-slate-400">${weekSummary(rows, sum)}</span>
                            <label className="ml-auto flex items-center gap-1.5 text-[10px] sm:text-[11px] font-bold text-slate-400">歷史週次
                                <select value=${viewWeek} onChange=${e => { setViewWeek(e.target.value); setSel(null); }} className="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-white cursor-pointer">
                                    ${weeks.map(w => html`<option key=${w} value=${w === currentWeek ? '' : w}>${w === currentWeek ? '本週（即時）' : `${mdLabel(w)} 週`}</option>`)}
                                </select>
                            </label>
                        </div>
                        <${WinStrip} rows=${rows} selected=${cur} onPick=${pick} />
                        <${SessionTable} rows=${rows} showPersonal=${false} selected=${cur} onPick=${pick} />
                        <p className="text-[10px] font-bold text-slate-400 px-3 sm:px-4 py-2">點任一盤可切換上方圖表。獲利率 = 該盤獲利 ÷ 本帳號起始資產；紅 = 賺、綠 = 賠。帳號走勢每 2 分鐘一筆（10/29 前為每 10 分鐘）。<span className="sm:hidden">表格可左右滑動。</span></p>
                    </div>

                </div>`;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
</body>
</html>
