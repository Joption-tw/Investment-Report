<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>歐大的投資報表</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3/dist/htm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        :root { --primary: #0f172a; --accent: #eab308; --danger: #dc2626; }
        html, body { margin: 0; padding: 0; height: auto !important; min-height: 100%; overflow: visible !important; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono-data { font-family: Arial, sans-serif; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0 !important; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 手機橫向（打橫）：顯示完整桌面表格，壓縮成滿版一頁 ===== */
        @media (orientation: landscape) and (max-height: 600px) {
            /* 用桌面版頁首，隱藏手機版頁首 */
            header.hidden.sm\:block { display: block !important; }
            .sm\:hidden { display: none !important; }

            /* 用桌面版表格，隱藏手機版卡片 */
            .hidden.lg\:block { display: block !important; }
            .lg\:hidden { display: none !important; }

            /* 頁首排成一行，貼齊截圖版面 */
            header .flex.flex-col.md\:flex-row { flex-direction: row !important; align-items: center !important; }
            header h1 { font-size: 1.1rem !important; }
            header .px-4.py-3 { padding: 0.4rem 1rem !important; }

            /* 版面滿版、去除多餘留白 */
            main { padding: 4px !important; background: #f1f5f9 !important; }
            main .max-w-7xl { max-width: 100% !important; }
            main .rounded-xl { border-radius: 6px !important; }
            main .overflow-x-auto { overflow-x: visible !important; }

            /* 表格壓縮：字級與內距縮小，11 欄剛好塞滿一頁不用捲動 */
            main table { width: 100% !important; table-layout: fixed !important; }
            main table th { padding: 6px 2px !important; font-size: 9px !important; line-height: 1.15 !important; letter-spacing: 0 !important; white-space: normal !important; }
            main table td { padding: 5px 2px !important; font-size: 9px !important; line-height: 1.1 !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
            /* 第一欄（社群暱稱）給多一點寬度 */
            main table th:first-child, main table td:first-child { width: 11% !important; white-space: normal !important; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f8fafc;gap:16px;">
            <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#eab308;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="font-family:'Noto Sans TC',sans-serif;font-size:1rem;color:#64748b;margin:0;">載入中，請稍候…</p>
        </div>
    </div>
    <script>
        const html = htm.bind(React.createElement);
        const { useState, useEffect, useCallback } = React;

        const VERSION  = "V2.2 優化版";
        const SHEET_ID = '1Ysw95KCFw-sHDUntrzsg7zCWPsiAyIIHJ1Yg69pKuKk';
        const GID      = '103299629';
        const RANGE    = 'C18:O30';
        const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}`;

        const RATIO_EXTREME = 0.30;
        const RATIO_WARNING = 0.35;
        const RATIO_MILD    = 0.40;
        const MARGIN_CRIT   = 10;
        const MARGIN_HIGH   = 20;
        const MARGIN_MED    = 30;
        const MARGIN_LOW    = 40;

        const parseCSV = (text) => {
            const lines = text.split(/\r?\n/);
            return lines.filter(line => line.trim() !== '').map(line => {
                const result = [];
                let cur = ''; let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"' && line[i + 1] === '"') { cur += '"'; i++; }
                    else if (char === '"') inQuote = !inQuote;
                    else if (char === ',' && !inQuote) { result.push(cur); cur = ''; }
                    else cur += char;
                }
                result.push(cur);
                return result;
            });
        };

        const isNegative = (val) => {
            if (typeof val !== 'string') return false;
            const trimmed = val.trim();
            return trimmed.startsWith('-') || (trimmed.startsWith('(') && trimmed.endsWith(')'));
        };

        const getRatioGradientClass = (header, val) => {
            if (!header || (!header.includes('比值平衡') && !header.includes('買權比值'))) return "";
            const num = parseFloat(val);
            if (isNaN(num) || (num >= RATIO_MILD && num <= (1 - RATIO_MILD))) return "";
            if (num <= RATIO_EXTREME || num >= (1 - RATIO_EXTREME)) return "bg-gradient-to-br from-yellow-500 via-yellow-400 to-yellow-300 text-slate-900 shadow-inner";
            if (num <= RATIO_WARNING || num >= (1 - RATIO_WARNING)) return "bg-gradient-to-br from-yellow-400 via-yellow-300 to-yellow-200 text-slate-900 shadow-sm";
            return "bg-gradient-to-br from-yellow-200 via-yellow-100 to-yellow-50 text-slate-900";
        };

        const getMarginGradientClass = (header, val) => {
            if (!header || (!header.includes('剩餘比率') && !header.includes('保證金剩餘比例'))) return "";
            const num = parseFloat(val.replace('%', ''));
            if (isNaN(num) || num > MARGIN_LOW) return "";
            if (num <= MARGIN_CRIT) return "bg-gradient-to-br from-red-950 via-red-900 to-red-800 text-white shadow-inner";
            if (num <= MARGIN_HIGH) return "bg-gradient-to-br from-red-800 via-red-700 to-red-600 text-white shadow-inner";
            if (num <= MARGIN_MED)  return "bg-gradient-to-br from-red-600 via-red-500 to-red-400 text-white";
            return "bg-gradient-to-br from-red-300 via-red-200 to-red-100 text-slate-900";
        };

        const getChangeColor = (val) => {
            if (!val) return 'text-white';
            const num = parseFloat(val.toString().replace('%', ''));
            if (num > 0) return 'text-red-500';
            if (num < 0) return 'text-green-500';
            return 'text-white';
        };

        const formatTime = (date) => date.toTimeString().split(' ')[0];

        const getCellStyle = (header, cell) => {
            const val = cell || '';
            const isNeg  = isNegative(val);
            const isDisc = header.includes('更新時間') && val.includes('斷線');
            const ratioGradient = getRatioGradientClass(header, val);
            const marginClass   = getMarginGradientClass(header, val);
            const isRatioHeader = header.includes('買權比值') || header.includes('比值平衡');
            const num = parseFloat(val.replace('%', ''));
            const isAlertExtreme = isRatioHeader && !isNaN(num) && (num < RATIO_WARNING || num > (1 - RATIO_WARNING));
            return { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme };
        };

        const App = () => {
            const [data, setData]               = useState([]);
            const [headers, setHeaders]         = useState([]);
            const [loading, setLoading]         = useState(true);
            const [refreshing, setRefreshing]   = useState(false);
            const [error, setError]             = useState(null);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [lastUpdated, setLastUpdated] = useState(null);
            const [countdown, setCountdown]     = useState(10);
            const [topStats, setTopStats]       = useState({ timeValue: '0.0', futureIndex: '0.0', pointsChange: '0.0', percentChange: '0%' });

            const fetchData = useCallback(async (isAuto = false) => {
                setCountdown(10);
                if (isAuto) setRefreshing(true);
                else setLoading(true);
                try {
                    const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                    if (!response.ok) throw new Error('無法讀取數據');
                    const text = await response.text();
                    if (!text) throw new Error('無法讀取數據');
                    const rawRows = parseCSV(text);
                    if (rawRows.length >= 2) {
                        const globalRow       = rawRows[0];
                        const originalHeaders = rawRows[1];
                        const originalData    = rawRows.slice(2);
                        const tvIdx = originalHeaders.findIndex(h => h.includes('時間價值'));
                        const fiIdx = originalHeaders.findIndex(h => h.includes('期貨指數'));
                        setTopStats({
                            timeValue:     tvIdx !== -1 ? (originalData[0] ? originalData[0][tvIdx] : '0.0') : '0.0',
                            futureIndex:   fiIdx !== -1 ? (originalData[0] ? originalData[0][fiIdx] : '0.0') : '0.0',
                            pointsChange:  globalRow[1] || '0',
                            percentChange: globalRow[2] || '0%'
                        });
                        const filteredHeaders = originalHeaders.filter((_, idx) => idx !== tvIdx && idx !== fiIdx);
                        const filteredData    = originalData.map(row => row.filter((_, idx) => idx !== tvIdx && idx !== fiIdx));
                        setHeaders(filteredHeaders);
                        setData(filteredData);
                        setLastUpdated(new Date());
                        setError(null);
                    }
                } catch (err) {
                    setError('連線異常');
                } finally {
                    setLoading(false);
                    setRefreshing(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
                const syncTimer  = setInterval(() => fetchData(true), 10000);
                const clockTimer = setInterval(() => {
                    setCurrentTime(new Date());
                    setCountdown(c => (c > 0 ? c - 1 : 0));
                }, 1000);
                return () => { clearInterval(syncTimer); clearInterval(clockTimer); };
            }, [fetchData]);

            const handleManualRefresh = () => { if (!refreshing) fetchData(true); };

            const renderDesktopRows = () => data.map((row, rIdx) => {
                const cells = row.map((cell, cIdx) => {
                    const { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme } = getCellStyle(headers[cIdx] || '', cell);
                    let cls = "px-4 py-2.5 text-xs font-bold font-mono-data text-center ";
                    if (isDisc)              cls += "bg-red-600 text-white animate-pulse";
                    else if (isAlertExtreme) cls += ratioGradient + " text-red-700 ring-2 ring-inset ring-red-600";
                    else if (marginClass)    cls += marginClass;
                    else if (ratioGradient)  cls += ratioGradient;
                    else if (isNeg)          cls += "text-red-500";
                    else                     cls += "text-slate-700";
                    return html`<td key=${cIdx} className=${cls}>${cell || '0'}</td>`;
                });
                return html`<tr key=${rIdx} className="hover:bg-slate-50 transition-colors">${cells}</tr>`;
            });

            const renderMobileCards = () => data.map((row, rIdx) => {
                const cardRows = headers.slice(1).map((h, i) => {
                    const cell = row[i + 1];
                    const { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme } = getCellStyle(h, cell);
                    let highlightClass = "";
                    let textClass = isNeg ? "text-red-500" : "text-slate-800";
                    if (marginClass)         { highlightClass = marginClass + " rounded"; if (marginClass.includes('text-white')) textClass = "text-white"; }
                    else if (isAlertExtreme) { highlightClass = ratioGradient + " rounded border-2 border-red-600 shadow-inner"; textClass = "text-red-700"; }
                    else if (isDisc)         { highlightClass = "bg-red-600 text-white rounded animate-pulse"; textClass = "text-white"; }
                    else if (ratioGradient)  { highlightClass = ratioGradient + " rounded border border-yellow-400 shadow-sm"; textClass = "text-slate-900"; }
                    const labelClass = "text-[9px] font-bold uppercase truncate max-w-[60px] leading-none tracking-tighter " + (highlightClass && textClass === "text-white" ? 'text-white' : 'text-slate-400');
                    return html`
                        <div key=${i} className=${"flex justify-between items-center border-b border-slate-50 py-1 px-1.5 " + highlightClass}>
                            <span className=${labelClass}>${h}</span>
                            <span className=${"text-xs font-mono-data font-black leading-none " + textClass}>${cell || '0'}</span>
                        </div>`;
                });
                return html`
                    <div key=${rIdx} className="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                        <div className="bg-slate-900 px-3 py-1.5 flex justify-between items-center">
                            <span className="text-white font-bold text-xs tracking-tight">${row[0]}</span>
                            <span className="text-[8px] bg-yellow-400 text-slate-900 px-1.5 py-0.5 rounded font-black shrink-0">#${rIdx + 1}</span>
                        </div>
                        <div className="p-2 grid grid-cols-2 gap-y-1 gap-x-2">${cardRows}</div>
                    </div>`;
            });

            let mainContent;
            if (loading && data.length === 0) {
                mainContent = html`
                    <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                        <div className="w-8 h-8 border-4 border-slate-200 border-t-yellow-400 rounded-full animate-spin mb-4"></div>
                        <p className="text-xs font-bold uppercase tracking-widest font-mono">Loading Data...</p>
                    </div>`;
            } else if (error) {
                mainContent = html`
                    <div className="bg-red-50 border border-red-200 p-6 rounded-xl text-center my-10 max-w-sm mx-auto">
                        <p className="text-red-600 font-bold mb-4">⚠️ 連線異常</p>
                        <button onClick=${() => fetchData()} className="px-6 py-2 bg-red-600 text-white rounded-lg text-sm font-bold">重新嘗試</button>
                    </div>`;
            } else {
                mainContent = html`
                    <div className="max-w-7xl mx-auto">
                        <div className="hidden lg:block bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="bg-slate-900 text-slate-300">
                                            ${headers.map((h, i) => html`<th key=${i} className="px-4 py-3 text-[11px] font-black uppercase tracking-wider text-center border-slate-800">${h}</th>`)}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        ${renderDesktopRows()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="lg:hidden grid grid-cols-1 md:grid-cols-2 gap-2">
                            ${renderMobileCards()}
                            <div className="col-span-full py-10 text-center opacity-20">
                                <p className="text-[9px] font-black tracking-[0.4em] uppercase">END OF STREAM</p>
                            </div>
                        </div>
                    </div>`;
            }

            const pointsChangeFormatted = parseFloat(topStats.pointsChange) > 0 ? '+' + topStats.pointsChange : topStats.pointsChange;

            return html`
                <div className="flex flex-col min-h-screen bg-slate-50 select-none overflow-x-hidden">
                    <header className="hidden sm:block sticky top-0 bg-slate-900 text-white shadow-lg z-50 border-b border-slate-800">
                        <div className="flex items-center justify-between px-3 py-1.5 border-b border-white/5">
                            <div className="flex items-center gap-2">
                                <div className=${"w-2 h-2 rounded-full " + (refreshing ? 'bg-yellow-400 animate-pulse' : 'bg-emerald-500')}></div>
                                <span className="text-[9px] font-bold tracking-widest text-slate-400 uppercase">System Active | ${VERSION}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                ${lastUpdated && html`<span className="text-[9px] font-mono-data text-slate-500">資料 ${formatTime(lastUpdated)}</span>`}
                                <span className="text-[9px] font-mono-data text-slate-500">${refreshing ? '更新中…' : `${countdown}s 後更新`}</span>
                                <div className="text-[10px] font-mono-data font-bold text-slate-300">${formatTime(currentTime)}</div>
                            </div>
                        </div>
                        <div className="flex flex-col md:flex-row md:items-center">
                            <div className="bg-yellow-400 text-slate-900 px-4 py-3 md:py-4 flex-1">
                                <h1 className="text-xl md:text-2xl font-black italic tracking-tighter uppercase">歐大的投資報表</h1>
                            </div>
                            <div className="flex divide-x divide-slate-800 bg-slate-900 border-t border-slate-800 md:border-t-0">
                                <div className="px-4 py-1.5 flex flex-col items-center justify-center text-center">
                                    <span className="text-[8px] text-slate-500 font-bold uppercase mb-1 leading-none">時間價值</span>
                                    <span className="text-emerald-400 font-mono-data font-bold text-xs md:text-base leading-none">${topStats.timeValue}</span>
                                </div>
                                <div className="px-4 py-1.5 flex flex-col items-center justify-center text-center">
                                    <span className="text-[8px] text-slate-500 font-bold uppercase mb-1 leading-none">期貨指數</span>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-emerald-400 font-mono-data font-bold text-xs md:text-base leading-none">${topStats.futureIndex}</span>
                                        <span className=${"text-[11px] font-mono-data font-bold " + getChangeColor(topStats.pointsChange)}>${pointsChangeFormatted}</span>
                                        <span className=${"text-[11px] font-mono-data font-bold " + getChangeColor(topStats.percentChange)}>(${topStats.percentChange})</span>
                                    </div>
                                </div>
                                <button onClick=${handleManualRefresh} disabled=${refreshing} className="px-4 py-1.5 flex flex-col items-center justify-center text-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors disabled:opacity-40 cursor-pointer">
                                    <span className=${"text-base leading-none " + (refreshing ? 'animate-spin inline-block' : '')}>↻</span>
                                    <span className="text-[8px] font-bold uppercase mt-1 leading-none">刷新</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="sm:hidden sticky top-0 z-50 bg-slate-50 pb-1">
                        <div className="space-y-1">
                            <div className="flex justify-between items-center bg-slate-900 px-3 py-1.5 shadow-md">
                                <div className="flex items-center gap-1.5">
                                    <div className=${"w-1.5 h-1.5 rounded-full " + (refreshing ? 'bg-yellow-400 animate-pulse' : 'bg-emerald-500')}></div>
                                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">LIVE | ${VERSION}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    ${lastUpdated && html`<span className="text-[9px] font-mono-data text-slate-500">資料 ${formatTime(lastUpdated)}</span>`}
                                    <span className="text-[9px] font-mono-data text-slate-500">${refreshing ? '更新中…' : `${countdown}s後更新`}</span>
                                    <div className="text-[10px] font-mono-data text-slate-300 font-bold">${formatTime(currentTime)}</div>
                                    <button onClick=${handleManualRefresh} disabled=${refreshing} className=${"text-slate-400 hover:text-white disabled:opacity-40 text-sm leading-none cursor-pointer " + (refreshing ? 'animate-spin inline-block' : '')}>↻</button>
                                </div>
                            </div>
                            <div className="flex divide-x divide-slate-800 bg-slate-900 overflow-hidden border-b border-slate-800 shadow-md">
                                <div className="flex-1 p-2 flex flex-col items-center justify-center text-center">
                                    <span className="text-[8px] text-slate-500 font-bold uppercase mb-0.5 leading-none">時間價值</span>
                                    <span className="text-emerald-400 font-mono-data font-bold text-xs leading-none">${topStats.timeValue}</span>
                                </div>
                                <div className="flex-[1.5] p-2 flex flex-col items-center justify-center text-center">
                                    <span className="text-[8px] text-slate-500 font-bold uppercase mb-0.5 leading-none">期貨指數 / 漲跌</span>
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-emerald-400 font-mono-data font-bold text-xs leading-none">${topStats.futureIndex}</span>
                                        <span className=${"text-[10px] font-mono-data font-bold " + getChangeColor(topStats.pointsChange)}>${pointsChangeFormatted}</span>
                                        <span className=${"text-[10px] font-mono-data font-bold " + getChangeColor(topStats.percentChange)}>(${topStats.percentChange})</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <main className="p-1 sm:p-4 bg-[#f1f5f9]">
                        ${mainContent}
                    </main>
                    <${SessionPanel} />
                </div>`;
        };

        // ===== 每盤績效表：一週 10 盤，每一盤的勝敗 =====
        // 收完的盤：GitHub Actions（scripts/record_sessions.py）存到 data/sessions.json
        // 進行中的盤：即時讀試算表上方的總表（C2:P14）；百點震幅 / BA / BB 讀示範帳戶試算表，VIX 讀 demo-performance 的 /api/vix
        // 每盤獲利 = 本盤收盤的本週累積獲利 − 上一盤收盤的本週累積獲利（週三夜盤是一週第一盤，起始資產重設後從 0 起算）
        const SESSIONS_URL = 'data/sessions.json';
        const LIVE_URL     = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}&range=C2:P14`;
        const DEMO_URL     = 'https://docs.google.com/spreadsheets/d/1AsY4_MJipaMp_cNLpyeXTpFGnG0FD4vWJu-SDRdvtME/export?format=csv&gid=1823639969';
        const VIX_URL      = 'https://demo-performance.vercel.app/api/vix';
        const SLOT_DEFS = [
            { label: '週三晚', short: '三晚', off: 0, type: 'N' }, { label: '週四早', short: '四早', off: 1, type: 'D' },
            { label: '週四晚', short: '四晚', off: 1, type: 'N' }, { label: '週五早', short: '五早', off: 2, type: 'D' },
            { label: '週五晚', short: '五晚', off: 2, type: 'N' }, { label: '週一早', short: '一早', off: 5, type: 'D' },
            { label: '週一晚', short: '一晚', off: 5, type: 'N' }, { label: '週二早', short: '二早', off: 6, type: 'D' },
            { label: '週二晚', short: '二晚', off: 6, type: 'N' }, { label: '週三早', short: '三早', off: 7, type: 'D' }
        ];
        // 示範帳戶試算表每盤的列範圍（同 demo-performance）
        const DEMO_ROWS = [[2, 419], [420, 569], [570, 989], [990, 1139], [1140, 1559], [1560, 1709], [1710, 2129], [2130, 2279], [2280, 2699], [2700, 2849]];

        // 時間一律用台灣時間：Date 的 UTC 欄位 = 台灣時間
        const tpeNow  = () => new Date(Date.now() + 8 * 3600e3);
        const ymd     = d => d.toISOString().slice(0, 10);
        const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
        const mdLabel = s => `${+s.slice(5, 7)}/${s.slice(8, 10)}`;
        const toNum   = v => { const m = String(v || '').match(/-?[\d,]*\.?\d+/); return m ? parseFloat(m[0].replace(/,/g, '')) : null; };
        const weekOf  = (date, type) => {
            const wd = new Date(date + 'T00:00:00Z').getUTCDay();
            if (type === 'N' && wd === 3) return date;
            return addDays(date, -(((wd - 3 + 7) % 7) || 7));
        };
        // 某個時間點屬於哪一盤（收盤後到下一盤前的空檔算剛收的那盤；週末算週五夜盤）
        const slotAt = (t) => {
            const m = t.getUTCHours() * 60 + t.getUTCMinutes(), today = ymd(t);
            const date = m < 8 * 60 + 45 ? addDays(today, -1) : today;
            const type = m < 8 * 60 + 45 || m >= 15 * 60 ? 'N' : 'D';
            const week = weekOf(date, type);
            const off = Math.round((new Date(date) - new Date(week)) / 864e5);
            const slot = SLOT_DEFS.findIndex(s => s.off === off && s.type === type);
            return { week, slot: slot === -1 ? 4 : slot };
        };
        const slotDate = (week, i) => addDays(week, SLOT_DEFS[i].off);
        const slotEnd  = (week, i) => SLOT_DEFS[i].type === 'D' ? `${slotDate(week, i)} 13:45` : `${addDays(slotDate(week, i), 1)} 05:00`;
        const slotOpen = (week, i) => `${slotDate(week, i)} ${SLOT_DEFS[i].type === 'D' ? '08:45' : '15:00'}`;
        const nowStr   = () => tpeNow().toISOString().slice(0, 16).replace('T', ' ');

        // 試算表上方總表：時間列 → 標題列 → 各帳號 → 歐大總績效(參考)（範圍從 C 欄起算）
        const parseLive = (rows) => {
            const m = (rows[0] && rows[0][0] || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2}) (\d{1,2}):(\d{2})/);
            if (!m) return null;
            const accounts = []; let total = null;
            for (const c of rows.slice(2)) {
                const name = (c[0] || '').trim();
                if (!name) break;
                if (name.startsWith('歐大總績效')) {
                    total = { pnl: toNum(c[5]), personal: toNum(c[3]), base: accounts.reduce((s, a) => s + (a.base || 0), 0) };
                    break;
                }
                accounts.push({ name: name.replace(/\((主|副)\)$/, ''), pnl: toNum(c[5]), base: toNum(c[11]) });
            }
            if (!total || total.pnl === null) return null;
            const { week, slot } = slotAt(new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5])));
            return { week, slot, total, accounts, live: true };
        };

        // 百點震幅（同 demo-performance）
        const swing100 = (prices, threshold = 100) => {
            const v = prices.filter(p => p !== null);
            if (v.length < 2) return 0;
            let total = 0, pivot = v[0], hi = v[0], lo = v[0], trend = 0;
            for (const p of v.slice(1)) {
                if (trend === 0) { if (p >= pivot + threshold) { trend = 1; hi = p; } else if (p <= pivot - threshold) { trend = -1; lo = p; } }
                else if (trend === 1) { if (p > hi) hi = p; else if (p <= hi - threshold) { total += hi - pivot; trend = -1; pivot = hi; lo = p; } }
                else { if (p < lo) lo = p; else if (p >= lo + threshold) { total += pivot - lo; trend = 1; pivot = lo; hi = p; } }
            }
            if (trend === 1 && hi > pivot + threshold) total += hi - pivot;
            else if (trend === -1 && lo < pivot - threshold) total += pivot - lo;
            return Math.round(total);
        };
        const lastChg = (vals, ref) => {
            const v = vals.filter(x => x);
            if (!v.length) return null;
            const base = ref || v[0], chg = v[v.length - 1] - base;
            return { last: v[v.length - 1], chg, pct: base ? chg / base * 100 : 0, many: !!ref || v.length > 1 };
        };
        const inSession = (label, type) => {
            const m = (label || '').match(/(\d{1,2}):(\d{2})/);
            if (!m) return false;
            const t = +m[1] * 60 + +m[2];
            return type === 'D' ? t >= 525 && t <= 825 : t >= 900 || t <= 300;
        };
        // 示範帳戶試算表 → 本週每盤的百點震幅 / BA / BB
        const parseDemoMarket = (rows, week) => {
            const data = rows.slice(1).filter(c => c.length >= 54);
            const start = (data.find(c => c[8] && c[1]) || [])[1] || '';
            if (!start.replace(/\//g, '-').startsWith(week)) return {};
            const out = {};
            DEMO_ROWS.forEach(([a, b], i) => {
                const seg = data.slice(a - 2, b - 1).filter(c => inSession(c[0], SLOT_DEFS[i].type));
                if (!seg.some(c => toNum(c[22]))) return;
                out[i] = { swing: swing100(seg.map(c => toNum(c[22]))), ba: lastChg(seg.map(c => toNum(c[52]))), bb: lastChg(seg.map(c => toNum(c[53]))) };
            });
            return out;
        };

        // 一週 10 盤：每盤的勝敗、獲利、累積
        const buildWeek = (week, sessions, live, liveMarket, liveVix) => {
            const recorded = {};
            sessions.filter(s => s.week === week).forEach(s => { recorded[s.slot] = s; });
            const prevWeekLast = sessions.filter(s => s.week < week).slice(-1)[0] || null;
            const now = nowStr();
            let prev = null;
            return SLOT_DEFS.map((def, i) => {
                const date = slotDate(week, i);
                const state = recorded[i] || (live && live.week === week && live.slot === i ? live : null);
                const market = { ...(liveMarket[i] || {}), ...((recorded[i] && recorded[i].market) || {}) };
                if (def.type === 'D' && !market.vix && liveVix && liveVix.date === date) market.vix = liveVix.vix;
                if (!state) {
                    const status = now < slotOpen(week, i) ? '尚未開盤' : now < slotEnd(week, i) ? '等待資料' : '無紀錄';
                    return { i, def, date, status, market };
                }
                const row = { i, def, date, state, market, live: !!state.live };
                // 基準：上一盤收盤；週三夜盤是一週第一盤（起始資產重設、累積獲利歸 0）
                let basePnl = null, basePersonal = null, baseAcc = {};
                if (i === 0) {
                    if (prevWeekLast && state.total.base === prevWeekLast.total.base) { row.pending = true; prev = state; return row; }
                    basePnl = 0; basePersonal = 0;
                } else if (prev) {
                    basePnl = prev.total.pnl; basePersonal = prev.total.personal;
                    prev.accounts.forEach(a => { baseAcc[a.name] = a.pnl; });
                } else if (state.open) {           // 前面幾盤沒存到（例：剛開始記錄）→ 以本盤開盤第一筆為基準
                    basePnl = state.open.total; baseAcc = state.open.accounts; row.approx = true;
                }
                if (basePnl !== null) {
                    row.pnl = state.total.pnl - basePnl;
                    row.personal = basePersonal !== null && state.total.personal !== null ? state.total.personal - basePersonal : null;
                    row.rate = state.total.base ? row.pnl / state.total.base * 100 : null;
                    row.acc = {};
                    state.accounts.forEach(a => { if (a.pnl !== null) row.acc[a.name] = a.pnl - (baseAcc[a.name] || 0); });
                }
                row.cum = state.total.base ? state.total.pnl / state.total.base * 100 : null;
                prev = state;
                return row;
            });
        };

        const fmtInt = v => Math.round(v).toLocaleString();
        const sgnInt = v => `${v > 0 ? '+' : ''}${fmtInt(v)}`;
        const sgnPct = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
        const toneOf = v => v > 0 ? 'text-red-600' : v < 0 ? 'text-emerald-600' : 'text-slate-500';
        const resultOf = v => v === undefined || v === null ? null : v > 0 ? 'win' : v < 0 ? 'lose' : 'flat';
        const RESULT = {
            win:  { text: '勝', badge: 'bg-red-600 text-white',     row: 'bg-red-50/70',     cell: 'bg-red-50 text-red-600' },
            lose: { text: '敗', badge: 'bg-emerald-600 text-white', row: 'bg-emerald-50/70', cell: 'bg-emerald-50 text-emerald-700' },
            flat: { text: '平', badge: 'bg-slate-400 text-white',   row: '',                 cell: 'text-slate-500' }
        };

        const SessionPanel = () => {
            const [sessions, setSessions]     = useState([]);
            const [live, setLive]             = useState(null);
            const [liveMarket, setLiveMarket] = useState({});
            const [liveVix, setLiveVix]       = useState(null);
            const [viewWeek, setViewWeek]     = useState('');
            const currentWeek = (live && live.week) || slotAt(tpeNow()).week;

            const loadLive = useCallback(async () => {
                const t = Date.now();
                const [s, l] = await Promise.allSettled([
                    fetch(`${SESSIONS_URL}?t=${t}`).then(r => r.ok ? r.json() : null),
                    fetch(`${LIVE_URL}&t=${t}`).then(r => r.ok ? r.text() : '')
                ]);
                if (s.status === 'fulfilled' && s.value) setSessions(s.value.sessions || []);
                if (l.status === 'fulfilled' && l.value) setLive(parseLive(parseCSV(l.value)));
            }, []);
            const loadMarket = useCallback(async () => {
                const week = slotAt(tpeNow()).week;
                const [d, v] = await Promise.allSettled([
                    fetch(`${DEMO_URL}&t=${Date.now()}`).then(r => r.ok ? r.text() : ''),
                    fetch(VIX_URL).then(r => r.ok ? r.json() : null)
                ]);
                if (d.status === 'fulfilled' && d.value) setLiveMarket(parseDemoMarket(parseCSV(d.value), week));
                if (v.status === 'fulfilled' && v.value && v.value.tradeDay && v.value.ticks) {
                    const td = v.value.tradeDay;
                    const vals = v.value.ticks.filter(([t]) => String(t).padStart(6, '0') <= '134500').map(([, x]) => x);
                    setLiveVix({ date: `${td.slice(0, 4)}-${td.slice(4, 6)}-${td.slice(6, 8)}`, vix: lastChg(vals, v.value.quote && v.value.quote.ref) });
                }
            }, []);

            useEffect(() => {
                loadLive(); loadMarket();
                const t1 = setInterval(loadLive, 60000);
                const t2 = setInterval(loadMarket, 120000);
                return () => { clearInterval(t1); clearInterval(t2); };
            }, [loadLive, loadMarket]);

            const week = viewWeek || currentWeek;
            const isCurrent = week === currentWeek;
            const rows = buildWeek(week, sessions, isCurrent ? live : null, isCurrent ? liveMarket : {}, isCurrent ? liveVix : null);
            const weeks = [...new Set([currentWeek, ...sessions.map(s => s.week)])].sort().reverse();

            const opened = rows.filter(r => r.state && !r.pending);
            const win  = opened.filter(r => resultOf(r.pnl) === 'win').length;
            const lose = opened.filter(r => resultOf(r.pnl) === 'lose').length;
            const lastRow = opened[opened.length - 1];
            const cum = lastRow ? lastRow.cum : null;
            const latestIdx = lastRow ? lastRow.i : -1;
            const accounts = [];
            opened.forEach(r => r.state.accounts.forEach(a => { if (!accounts.includes(a.name)) accounts.push(a.name); }));

            const dash = html`<span className="text-slate-300">—</span>`;
            const th = "px-2 py-2.5 text-[11px] font-black tracking-wider text-center border-slate-800 whitespace-nowrap";
            const td = "px-2 py-2 text-xs font-bold font-mono-data whitespace-nowrap";
            const valCell = (r, color, d = 0) => r ? html`
                <div className=${"font-black " + color}>${r.last.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d })}</div>
                ${r.many && html`<div className=${"text-[10px] " + (r.chg >= 0 ? 'text-red-500' : 'text-emerald-500')}>${r.chg > 0 ? '+' : ''}${r.chg.toFixed(d)} (${sgnPct(r.pct)})</div>`}` : dash;
            const badge = (res, big) => res ? html`<span className=${"inline-flex items-center justify-center rounded-md font-black " + RESULT[res].badge + (big ? " w-8 h-7 text-sm" : " w-6 h-6 text-xs")}>${RESULT[res].text}</span>` : null;
            const slotName = (r) => html`<span className=${"inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle " + (r.def.type === 'N' ? 'bg-slate-700' : 'bg-orange-400')}></span>${r.def.label}`;

            const summary = opened.length
                ? `${mdLabel(rows[0].date)} ~ ${mdLabel(rows[9].date)} · 已開 ${opened.length} 盤 · 勝 ${win} 盤、敗 ${lose} 盤 · 累積 ${cum !== null ? sgnPct(cum) : '—'}`
                : `${mdLabel(rows[0].date)} ~ ${mdLabel(rows[9].date)} · 本週尚無資料`;

            return html`
                <section className="px-1 sm:px-4 pb-20 bg-[#f1f5f9]">
                    <div className="max-w-7xl mx-auto space-y-4">
                        <div className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-slate-900 px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1.5">
                                <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">每盤績效表<span className="text-white">${isCurrent ? '（本週）' : `（${mdLabel(week)} 週）`}</span></h2>
                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400">${summary}</span>
                                <label className="ml-auto flex items-center gap-1.5 text-[10px] sm:text-[11px] font-bold text-slate-400">歷史週次
                                    <select value=${viewWeek} onChange=${e => setViewWeek(e.target.value)} className="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-white cursor-pointer">
                                        ${weeks.map(w => html`<option key=${w} value=${w === currentWeek ? '' : w}>${w === currentWeek ? '本週（即時）' : `${mdLabel(w)} 週`}</option>`)}
                                    </select>
                                </label>
                            </div>
                            <div className="flex gap-1 sm:gap-1.5 px-2 sm:px-4 py-3 border-b border-slate-100 overflow-x-auto">
                                ${rows.map(r => {
                                    const res = r.pending ? null : resultOf(r.pnl);
                                    return html`
                                        <div key=${r.i} className="flex-1 min-w-[28px] flex flex-col items-center gap-1">
                                            <span className=${"text-[10px] font-black " + (r.def.type === 'N' ? 'text-slate-600' : 'text-orange-500')}>${r.def.short}</span>
                                            <div className=${"w-full h-9 rounded-md flex items-center justify-center text-sm font-black " + (res ? RESULT[res].badge : 'bg-slate-100 text-slate-300') + (r.live ? ' ring-2 ring-offset-1 ring-blue-500' : '')}>
                                                ${res ? RESULT[res].text : (r.state ? '…' : '·')}
                                            </div>
                                            <span className=${"text-[9px] font-bold font-mono-data " + (r.pnl !== undefined ? toneOf(r.pnl) : 'text-slate-300')}>${r.rate !== undefined && r.rate !== null ? sgnPct(r.rate) : mdLabel(r.date)}</span>
                                        </div>`;
                                })}
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="bg-slate-900 text-slate-300">
                                            <th className=${th}>日期</th><th className=${th}>盤別</th><th className=${th}>勝負</th>
                                            <th className=${th}>百點震幅</th><th className=${th}>週三時價 (BA)</th><th className=${th}>週五時價 (BB)</th><th className=${th}>VIX</th>
                                            <th className=${th}>獲利金額</th><th className=${th}>個人獲利</th><th className=${th}>獲利率</th><th className=${th}>累積獲利率</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rows.map(r => {
                                            if (!r.state) return html`
                                                <tr key=${r.i} className="text-slate-300">
                                                    <td className=${td + " text-center"}>${mdLabel(r.date)}</td>
                                                    <td className=${td}>${slotName(r)}</td>
                                                    <td className=${td + " text-center text-[11px]"}>${r.status}</td>
                                                    ${[...Array(8)].map((_, k) => html`<td key=${k} className=${td + " text-right"}>—</td>`)}
                                                </tr>`;
                                            const res = r.pending ? null : resultOf(r.pnl);
                                            const m = r.market;
                                            const tag = r.live ? html`<span className="ml-1.5 inline-flex items-center gap-1 text-[10px] font-bold text-blue-600"><span className="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>進行中</span>`
                                                      : r.i === latestIdx ? html`<span className="ml-1.5 text-[10px] font-bold text-blue-500">最新</span>` : null;
                                            return html`
                                                <tr key=${r.i} className=${res ? RESULT[res].row : ''}>
                                                    <td className=${td + " text-center text-slate-500"}>${mdLabel(r.date)}</td>
                                                    <td className=${td + " text-slate-800 font-black"}>${slotName(r)}${tag}</td>
                                                    <td className=${td + " text-center"}>${r.pending ? html`<span className="text-[11px] text-slate-400">結算中</span>` : badge(res, true) || dash}</td>
                                                    <td className=${td + " text-right text-slate-800"}>${m.swing !== undefined ? fmtInt(m.swing) : dash}</td>
                                                    <td className=${td + " text-right leading-tight"}>${valCell(m.ba, 'text-red-600')}</td>
                                                    <td className=${td + " text-right leading-tight"}>${valCell(m.bb, 'text-green-600')}</td>
                                                    <td className=${td + " text-right leading-tight"}>${r.def.type === 'D' ? valCell(m.vix, 'text-amber-600', 2) : dash}</td>
                                                    <td className=${td + " text-right text-sm font-black " + toneOf(r.pnl)}>${r.pnl !== undefined ? sgnInt(r.pnl) : dash}${r.approx ? html`<span className="text-[9px] text-slate-400 ml-0.5" title="前一盤未記錄，以本盤第一筆快照為基準">≈</span>` : null}</td>
                                                    <td className=${td + " text-right " + toneOf(r.personal)}>${r.personal !== undefined && r.personal !== null ? sgnInt(r.personal) : dash}</td>
                                                    <td className=${td + " text-right text-sm font-black " + toneOf(r.rate)}>${r.rate !== undefined && r.rate !== null ? sgnPct(r.rate) : dash}</td>
                                                    <td className=${td + " text-right " + toneOf(r.cum)}>${r.cum !== undefined && r.cum !== null && !r.pending ? sgnPct(r.cum) : dash}</td>
                                                </tr>`;
                                        })}
                                    </tbody>
                                    ${lastRow && html`
                                        <tfoot>
                                            <tr className="bg-slate-50 font-black">
                                                <td className=${td + " text-slate-800"} colSpan="2">本週合計</td>
                                                <td className=${td + " text-center text-slate-600"} colSpan="5">已開 ${opened.length} 盤 · <span className="text-red-600">勝 ${win}</span> · <span className="text-emerald-600">敗 ${lose}</span></td>
                                                <td className=${td + " text-right text-sm " + toneOf(lastRow.state.total.pnl)}>${sgnInt(lastRow.state.total.pnl)}</td>
                                                <td className=${td + " text-right " + toneOf(lastRow.state.total.personal)}>${lastRow.state.total.personal !== null ? sgnInt(lastRow.state.total.personal) : '—'}</td>
                                                <td className=${td}></td>
                                                <td className=${td + " text-right text-sm " + toneOf(cum)}>${cum !== null ? sgnPct(cum) : '—'}</td>
                                            </tr>
                                        </tfoot>`}
                                </table>
                            </div>
                            <p className="text-[10px] font-bold text-slate-400 px-3 sm:px-4 py-2">勝敗以全部帳號合計（眾人獲利）判定；獲利率 = 該盤獲利 ÷ 各帳號起始資產合計。紅 = 賺、綠 = 賠。<span className="sm:hidden">表格可左右滑動。</span></p>
                        </div>

                        ${accounts.length > 0 && html`
                            <div className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                                <div className="bg-slate-900 px-3 sm:px-4 py-2.5">
                                    <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">各帳號每盤損益<span className="text-white">${isCurrent ? '（本週）' : `（${mdLabel(week)} 週）`}</span></h2>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="bg-slate-900 text-slate-300">
                                                <th className=${th + " sticky left-0 bg-slate-900 z-10"}>帳號</th>
                                                ${rows.map(r => html`<th key=${r.i} className=${th}><div>${r.def.label}</div><div className="text-[9px] font-bold text-slate-500">${mdLabel(r.date)}</div></th>`)}
                                                <th className=${th + " text-yellow-400"}>本週累積</th>
                                                <th className=${th}>勝敗</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${[...accounts, null].map(name => {
                                                const isTotal = name === null;
                                                const vals = rows.map(r => r.pending || r.pnl === undefined ? undefined : isTotal ? r.pnl : r.acc[name]);
                                                const w = vals.filter(v => resultOf(v) === 'win').length, l = vals.filter(v => resultOf(v) === 'lose').length;
                                                const lastAcc = lastRow && lastRow.state.accounts.find(a => a.name === name);
                                                const cumVal = !lastRow ? null : isTotal ? lastRow.state.total.pnl : lastAcc ? lastAcc.pnl : null;
                                                return html`
                                                    <tr key=${name || '__total'} className=${isTotal ? 'bg-slate-50 font-black' : ''}>
                                                        <td className=${td + " sticky left-0 z-10 text-center " + (isTotal ? 'bg-slate-50 text-slate-900' : 'bg-white text-slate-700')}>${isTotal ? '合計（眾人）' : name}</td>
                                                        ${vals.map((v, k) => {
                                                            const res = resultOf(v);
                                                            return html`<td key=${k} className=${td + " text-right " + (res ? RESULT[res].cell : 'text-slate-300')}>${v !== undefined ? sgnInt(v) : ''}</td>`;
                                                        })}
                                                        <td className=${td + " text-right font-black " + toneOf(cumVal)}>${cumVal !== null ? sgnInt(cumVal) : '—'}</td>
                                                        <td className=${td + " text-center"}><span className="text-red-600">${w}勝</span> <span className="text-emerald-600">${l}敗</span></td>
                                                    </tr>`;
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>`}
                    </div>
                </section>`;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
