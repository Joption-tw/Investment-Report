<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 手機直向：整份排成一頁（用電腦版版面寬 1040 排好，再縮到螢幕寬，可雙指放大）；手機橫向：一般寬度 + 三頁（見下方 CSS）
        (function () {
            const meta = document.querySelector('meta[name="viewport"]');
            const portrait = matchMedia('(orientation: portrait)');
            const side = Math.min(screen.width, screen.height);
            function apply() {
                const on = side < 600 && portrait.matches;
                document.documentElement.classList.toggle('m-portrait', on);
                meta.setAttribute('content', on ? `width=1040, initial-scale=${(side / 1040).toFixed(3)}, minimum-scale=${(side / 1040).toFixed(3)}, maximum-scale=6` : 'width=device-width, initial-scale=1.0, viewport-fit=cover');
                syncVisible();
            }
            // 手機橫向用：實際可視範圍（放大時不跟著變，否則版面會亂跳）
            function syncVisible() {
                const v = window.visualViewport;
                if (!v || v.scale > 1.01) return;
                const st = document.documentElement.style;
                st.setProperty('--vv-top', `${v.offsetTop}px`);
                st.setProperty('--vv-h', `${v.height}px`);
                if (!portrait.matches && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
            }
            apply();
            portrait.addEventListener('change', apply);
            if (window.visualViewport) {
                visualViewport.addEventListener('resize', syncVisible);
                visualViewport.addEventListener('scroll', syncVisible);
            }
        })();
    </script>
    <title>歐大的投資報表</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3/dist/htm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js?v=20261031b"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        :root { --primary: #0f172a; --accent: #eab308; --danger: #dc2626; }
        html, body { margin: 0; padding: 0; height: auto !important; min-height: 100%; overflow: visible !important; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono-data { font-family: Arial, sans-serif; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0 !important; }
        #total-row td { border-color: #334155 !important; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 頁首重點：時間價值最大，其次漲跌（紅漲綠跌，整格帶底色），期貨指數再小一級 */
        .hl-cell { padding: 8px 20px; }
        .hl-label { margin-bottom: 6px; color: #cbd5e1; font-size: 13px; font-weight: 700; line-height: 1; white-space: nowrap; }
        .hl-tv { color: #fde047; font-size: 34px; font-weight: 900; line-height: 1; }
        .hl-fut { color: #fff; font-size: 22px; font-weight: 700; line-height: 1; }
        .hl-vix { color: #7dd3fc; font-size: 22px; font-weight: 700; line-height: 1; }
        .hl-chg { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; line-height: 1; }
        .hl-pts { font-size: 30px; font-weight: 900; }
        .hl-pct { font-size: 20px; font-weight: 700; }
        .hl-up { background: rgba(239, 68, 68, .18); }
        .hl-up .hl-chg { color: #fca5a5; }
        .hl-down { background: rgba(34, 197, 94, .18); }
        .hl-down .hl-chg { color: #4ade80; }
        /* 時間價值、期貨指數：格子本身是按鈕，點了放大走勢圖；數字旁邊是當盤的微型走勢 */
        .hl-btn { cursor: pointer; transition: background .15s; }
        .hl-btn:hover, .hl-btn:active { background: #1e293b; }
        .hl-body { display: flex; align-items: center; gap: 10px; }
        .hl-spark { position: relative; display: block; flex: none; width: 84px; height: 46px; }
        .hl-spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
        .hl-spark polyline { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
        .hl-spark i { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; }
        #trend-btn { display: none; }

        /* 放大的走勢圖：蓋在整個畫面上（掛在 body 底下，才蓋得過手機橫向的換頁鈕） */
        .tr-back { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, .65); }
        .tr-panel { display: flex; flex-direction: column; width: min(1120px, 100%); max-height: 100%; overflow: hidden; border-radius: 12px; background: #fff; box-shadow: 0 20px 50px rgba(15, 23, 42, .4); }
        .tr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 18px; background: #0f172a; color: #fff; }
        .tr-title { color: #facc15; font-size: 18px; font-weight: 900; }
        .tr-value { font-size: 28px; font-weight: 900; line-height: 1; }
        .tr-sub { color: #94a3b8; font-size: 13px; font-weight: 700; }
        .tr-note { margin-left: auto; color: #64748b; font-size: 12px; font-weight: 700; }
        .tr-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 18px; border-bottom: 1px solid #e2e8f0; }
        .tr-group { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #f1f5f9; }
        .tr-tab { min-height: 36px; padding: 0 14px; border-radius: 8px; color: #475569; font-size: 14px; font-weight: 800; cursor: pointer; }
        .tr-tab[aria-pressed="true"] { background: #0f172a; color: #fff; }
        .tr-close { min-height: 36px; margin-left: auto; padding: 0 14px; border-radius: 8px; background: #f1f5f9; color: #334155; font-size: 14px; font-weight: 800; cursor: pointer; }
        .tr-close:hover { background: #e2e8f0; }
        .tr-chart { position: relative; flex: 1 1 auto; min-height: 0; height: min(62vh, 560px); }
        .tr-chart > div { width: 100%; height: 100%; }
        .tr-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 15px; font-weight: 700; }

        /* 走勢圖：手機直向（1040 寬縮小顯示，字和按鈕都要放大） */
        html.m-portrait .tr-back { padding: 20px; }
        html.m-portrait .tr-head { padding: 24px 30px; gap: 8px 20px; }
        html.m-portrait .tr-title { font-size: 40px; }
        html.m-portrait .tr-value { font-size: 64px; }
        html.m-portrait .tr-sub { font-size: 28px; }
        html.m-portrait .tr-note { width: 100%; margin: 0; font-size: 24px; }
        html.m-portrait .tr-controls { padding: 20px 30px; gap: 16px 24px; }
        html.m-portrait .tr-tab, html.m-portrait .tr-close { min-height: 84px; padding: 0 28px; border-radius: 14px; font-size: 34px; }
        html.m-portrait .tr-group { padding: 6px; border-radius: 18px; }
        html.m-portrait .tr-chart { height: 1000px; }
        html.m-portrait .tr-msg { font-size: 34px; }
        @media (max-width: 639px) {
            .hl-cell { padding: 6px 4px; }
            .hl-label { margin-bottom: 4px; font-size: 11px; }
            .hl-tv { font-size: 24px; }
            .hl-fut, .hl-vix { font-size: 15px; }
            .hl-stats { flex-wrap: wrap; }
            .hl-stats > .hl-btn { flex: 1 1 30%; }
            .hl-stats > .hl-chg-cell { order: 5; flex: 1 1 100%; flex-direction: row; gap: 8px; }
            .hl-stats > .hl-chg-cell .hl-label { margin: 0; }
            .hl-chg { gap: 4px; }
            .hl-pts { font-size: 19px; }
            .hl-pct { font-size: 12px; }
            .hl-body { flex-direction: column; gap: 3px; width: 100%; }
            .hl-spark { width: 100%; height: 30px; }
            .tr-back { padding: 8px; }
            .tr-note { width: 100%; margin: 0; }
            .tr-controls { padding: 8px 10px; }
            .tr-tab, .tr-close { padding: 0 10px; }
        }

        /* 打橫提示只在手機直向出現 */
        #rotate-hint { display: none; }
        /* 可放大的頁面上，按鈕要關掉雙擊縮放，否則連按會被當成縮放手勢 */
        button, a, select { touch-action: manipulation; }

        /* ===== 電腦與手機橫向：分三頁，每頁一張表（第 1 頁總表、第 2 頁每盤績效表、第 3 頁各帳號每盤損益）；手機直向整份一頁 ===== */
        html:not(.m-portrait) #session-panel, html:not(.m-portrait) #page-session, html:not(.m-portrait) #page-accounts { display: none; }
        html:not(.m-portrait) body.m-page-2 main, html:not(.m-portrait) body.m-page-3 main { display: none; }
        html:not(.m-portrait) body.m-page-2 #session-panel, html:not(.m-portrait) body.m-page-3 #session-panel { display: block; }
        html:not(.m-portrait) body.m-page-2 #page-session, html:not(.m-portrait) body.m-page-3 #page-accounts { display: block !important; }
        html:not(.m-portrait) #session-panel { padding-top: 16px; }
        html:not(.m-portrait) #session-panel > div > * { margin-top: 0 !important; }
        html:not(.m-portrait) main { padding-bottom: 72px; }
        /* 換頁鈕放右下角並加大：iPhone 橫向時，點螢幕最上緣常被 Safari 拿去叫出網址列，按鈕收不到 */
        #page-nav { display: none; }
        html:not(.m-portrait) #page-nav { display: flex; align-items: center; position: fixed; z-index: 60;
                    right: max(10px, env(safe-area-inset-right)); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 4px);
                    min-height: 44px; border-radius: 12px; background: #1e293b; color: #fff; font-size: 14px; font-weight: 900; white-space: nowrap;
                    box-shadow: 0 2px 10px rgba(15, 23, 42, .35); }
        #page-nav button { width: 48px; height: 44px; color: #fff; font-size: 15px; font-weight: 900; border-radius: 12px; cursor: pointer; }
        #page-nav button:hover { background: #334155; }
        #page-nav button:active { background: #2563eb; }
        #page-nav button:disabled { color: #64748b; background: none; cursor: default; }

        /* ===== 手機直向：三張表排成一頁，字放大 ===== */
        html.m-portrait #rotate-hint { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 8px 8px 0; padding: 10px 16px; border-radius: 14px;
            background: #fef3c7; border: 3px solid #f59e0b; color: #92400e; font-size: 38px; font-weight: 900; line-height: 1.15; }
        html.m-portrait .rotate-hint-icon { width: 46px; height: 46px; transform: rotate(90deg); flex: none; }
        html.m-portrait header span, html.m-portrait header .font-mono-data { font-size: 15px !important; }
        html.m-portrait header h1 { font-size: 34px !important; }
        /* 直向畫面是 1040 寬縮小顯示，重點數字獨立成一整排才放得夠大 */
        html.m-portrait header > div:last-child { flex-direction: column !important; align-items: stretch !important; }
        html.m-portrait header .divide-x > * { flex: 1 1 auto !important; }
        html.m-portrait header .hl-label { margin-bottom: 10px; font-size: 22px !important; }
        html.m-portrait header .hl-tv { font-size: 68px !important; }
        html.m-portrait header .hl-fut, html.m-portrait header .hl-vix { font-size: 40px !important; }
        html.m-portrait header .hl-stats { flex-wrap: wrap; }
        html.m-portrait header .hl-stats > .hl-btn { flex: 1 1 30% !important; }
        html.m-portrait header .hl-stats > .hl-chg-cell { order: 5; flex: 1 1 70% !important; flex-direction: row; gap: 20px; border-top: 1px solid #1e293b; }
        html.m-portrait header .hl-stats > .hl-chg-cell .hl-label { margin: 0; }
        html.m-portrait header .hl-stats > .hl-refresh { order: 6; flex: 1 1 10% !important; border-top: 1px solid #1e293b; }
        html.m-portrait header .hl-pts { font-size: 58px !important; }
        html.m-portrait header .hl-pct { font-size: 36px !important; }
        html.m-portrait header .hl-body { flex-direction: column; gap: 10px; width: 100%; }
        html.m-portrait header .hl-spark { width: 100%; height: 90px; }
        html.m-portrait header .hl-spark polyline { stroke-width: 4px; }
        html.m-portrait header .hl-spark i { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
        html.m-portrait main { padding: 8px !important; }
        html.m-portrait #session-panel { padding: 0 8px 8px !important; }
        html.m-portrait #session-panel > div > * + * { margin-top: 8px !important; }
        html.m-portrait #app-root table { width: 100% !important; }
        html.m-portrait #app-root th { padding: 6px 2px !important; font-size: 14px !important; line-height: 1.15 !important; letter-spacing: 0 !important; white-space: normal !important; }
        html.m-portrait #app-root td { padding: 7px 3px !important; font-size: 15px !important; line-height: 1.2 !important; white-space: nowrap !important; }
        html.m-portrait #page-session td div + div { font-size: 12px !important; line-height: 1.1 !important; }
        html.m-portrait #app-root #total-row td { font-size: 18px !important; }
        html.m-portrait #total-row .total-label { font-size: 13px !important; }
        html.m-portrait #account-links { gap: 8px !important; margin: 8px 0 0 !important; }
        html.m-portrait #account-links span, html.m-portrait #account-links a { font-size: 17px !important; }
        html.m-portrait #account-links a { padding: 8px 12px !important; }
        html.m-portrait #session-panel h2 { font-size: 22px !important; }
        html.m-portrait #session-panel h2 ~ span, html.m-portrait #session-panel label, html.m-portrait #session-panel select { font-size: 15px !important; }
        html.m-portrait #page-session > p { font-size: 14px !important; }
        html.m-portrait #win-strip span { font-size: 14px !important; }
        html.m-portrait #win-strip .h-9 { font-size: 20px !important; }

        /* ===== 手機橫向（打橫）：版面固定貼齊可視範圍 ===== */
        @media (orientation: landscape) and (max-height: 600px) {
            html, body { height: 100% !important; overflow: hidden !important; }

            /* 固定貼齊實際可視範圍的最上方（iPhone 轉橫向時頁面可能被往下推）；左右只讓開瀏海；下方留白讓最後幾列能捲離換頁鈕 */
            #app-root { position: fixed !important; top: var(--vv-top, 0px);
                        left: max(0px, env(safe-area-inset-left)); right: max(0px, env(safe-area-inset-right));
                        height: var(--vv-h, 100vh); min-height: 0 !important; overflow-y: auto !important; padding-bottom: 56px; background: #f1f5f9 !important; }
            #app-root > * { flex: 0 0 auto; }

            /* 用桌面版頁首與表格，隱藏手機版頁首與卡片 */
            .sm\:hidden { display: none !important; }
            .hidden.lg\:block { display: block !important; }
            .lg\:hidden { display: none !important; }

            /* 頁首：壓成一行（標題、指數、刷新、更新時間） */
            header.hidden.sm\:block { display: flex !important; align-items: stretch !important; }
            header > div:first-child { order: 2; flex: 0 0 auto; gap: 8px; padding: 0 6px !important; border: 0 !important; }
            header > div:first-child > div:first-child, header .data-time { display: none; }
            header > div:last-child { order: 1; flex: 1 1 auto; min-width: 0; flex-direction: row !important; align-items: stretch !important; }
            header .px-4.py-3 { display: flex; align-items: center; padding: 2px 10px !important; }
            header h1 { font-size: 0.85rem !important; line-height: 1.1 !important; white-space: nowrap; }
            header .divide-x { border: 0 !important; }
            header .divide-x > * { flex: 0 0 auto !important; flex-direction: row !important; align-items: center !important; gap: 4px; padding: 1px 6px !important; }
            header .divide-x span { margin: 0 !important; }
            header .hl-label { font-size: 9px; }
            header .hl-tv { font-size: 20px; }
            header .hl-fut, header .hl-vix { font-size: 13px; }
            header .hl-stats { flex-wrap: nowrap; }
            header .hl-chg { gap: 3px; }
            header .hl-pts { font-size: 18px; }
            header .hl-pct { font-size: 12px; }
            header .hl-body { flex-direction: row; gap: 4px; width: auto; }
            header .hl-spark { width: 56px; height: 34px; }
            header .hl-refresh span:last-child { display: none; }
            header .hl-refresh span:first-child { font-size: 14px; }

            /* 版面滿版、去除多餘留白 */
            main, #session-panel { padding: 2px !important; }
            main .max-w-7xl, #session-panel .max-w-7xl { max-width: 100% !important; }
            #app-root .rounded-xl { border-radius: 4px !important; box-shadow: none !important; }

            /* 表格壓縮：字級跟著扣掉瀏海後的可用寬度走，一頁塞得下，不用左右捲動 */
            #app-root { --fit-font: clamp(9.5px, calc((100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) * .0145), 12.5px); }
            #app-root table { width: 100% !important; }
            #app-root th { padding: 2px !important; font-size: 9.5px !important; line-height: 1.1 !important; letter-spacing: 0 !important; white-space: normal !important; }
            #app-root td { padding: 3px !important; font-size: var(--fit-font) !important; line-height: 1.15 !important; white-space: nowrap !important; }

            #app-root #total-row td { font-size: calc(var(--fit-font) + 1px) !important; }
            #total-row .total-label { font-size: 8px !important; margin: 0 !important; }

            /* 表格下方的個別帳號連結：右邊讓開換頁鈕，按鈕夠高才好點 */
            #account-links { gap: 4px !important; margin: 4px 142px 0 2px !important; }
            #account-links span { font-size: 10px !important; }
            #account-links a { min-height: 34px; padding: 0 7px !important; font-size: 11px !important; border-radius: 8px; }

            /* 第 2、3 頁的標題列壓扁；勝敗條跟表格的勝負欄重複，收起來把空間留給表格 */
            #page-session > div:first-child, #page-accounts > div:first-child { padding: 1px 8px !important; }
            #session-panel h2 { font-size: 12px !important; white-space: nowrap; }
            #session-panel h2 ~ span, #session-panel label { font-size: 9.5px !important; }
            #session-panel select { padding: 0 4px !important; font-size: 11px !important; min-height: 22px; }
            #win-strip { display: none; }
            #page-session td { padding: 1px 3px !important; font-size: min(var(--fit-font), 11px) !important; }
            #page-session td div + div { font-size: 8px !important; line-height: 1 !important; }
            #page-session td .h-7 { width: 22px !important; height: 16px !important; font-size: 10px !important; }
            #page-session > p { padding: 3px 8px !important; }

            /* 最上緣不好點，放大走勢圖的入口也放一顆在左下角 */
            #trend-btn { display: flex; align-items: center; position: fixed; z-index: 60;
                         left: max(10px, env(safe-area-inset-left)); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 4px);
                         min-height: 44px; padding: 0 14px; border-radius: 12px; background: #1e293b; color: #fff; font-size: 14px; font-weight: 900; white-space: nowrap;
                         box-shadow: 0 2px 10px rgba(15, 23, 42, .35); }
            #trend-btn:active { background: #2563eb; }

            /* 走勢圖滿版；切換鈕移到最下面，上緣留給標題 */
            .tr-back { top: var(--vv-top, 0px); bottom: auto; left: 0; right: 0; height: var(--vv-h, 100vh); padding: 0; }
            .tr-panel { width: 100%; height: 100%; border-radius: 0; padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
            .tr-head { flex-wrap: nowrap; gap: 8px; padding: 3px 10px; white-space: nowrap; }
            .tr-title { font-size: 13px; }
            .tr-value { font-size: 18px; }
            .tr-sub { font-size: 11px; }
            .tr-note { display: none; }
            .tr-chart { order: 2; height: auto; }
            .tr-controls { order: 3; flex-wrap: nowrap; padding: 4px 10px calc(max(4px, env(safe-area-inset-bottom))); border-top: 1px solid #e2e8f0; border-bottom: 0; }
            .tr-tab, .tr-close { min-height: 40px; }
        }
        /* 手機橫向放不下更新時間，讓給重點數字；較窄的連標題也收起來，再窄就連微型走勢也收起來 */
        @media (orientation: landscape) and (max-height: 600px) {
            header > div:first-child { display: none !important; }
        }
        @media (orientation: landscape) and (max-height: 600px) and (max-width: 860px) {
            header .px-4.py-3 { display: none !important; }
            header .hl-stats { flex: 1 1 auto; }
            header .hl-stats > * { flex: 1 1 auto !important; justify-content: center; }
        }
        @media (orientation: landscape) and (max-height: 600px) and (max-width: 760px) {
            header .hl-spark { width: 36px; }
        }
        @media (orientation: landscape) and (max-height: 600px) and (max-width: 620px) {
            header .hl-spark { display: none; }
        }
    </style>
</head>
<body>
    <div id="page-nav">
        <button type="button" id="page-prev" aria-label="上一頁" disabled onclick="setMobilePage(mobilePage - 1)">◀</button>
        <span id="page-no">1 / 3</span>
        <button type="button" id="page-next" aria-label="下一頁" onclick="setMobilePage(mobilePage + 1)">▶</button>
    </div>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f8fafc;gap:16px;">
            <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#eab308;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="font-family:'Noto Sans TC',sans-serif;font-size:1rem;color:#64748b;margin:0;">載入中，請稍候…</p>
        </div>
    </div>
    <script>
        // 換頁：電腦與手機橫向分三頁（手機直向整份一頁，CSS 不看這個 class）
        let mobilePage = 1;
        function setMobilePage(n) {
            mobilePage = n;
            document.body.classList.toggle('m-page-2', n === 2);
            document.body.classList.toggle('m-page-3', n === 3);
            document.getElementById('page-no').innerText = `${n} / 3`;
            document.getElementById('page-prev').disabled = n === 1;
            document.getElementById('page-next').disabled = n === 3;
            const root = document.getElementById('app-root');
            if (root) root.scrollTop = 0;
            window.scrollTo(0, 0);
        }

        const { useState, useEffect, useCallback, useRef } = React;

        const VERSION  = "V2.2 優化版";
        const SHEET_ID = '1Ysw95KCFw-sHDUntrzsg7zCWPsiAyIIHJ1Yg69pKuKk';
        const GID      = '103299629';
        const RANGE    = 'C2:O14';
        const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}`;

        // 總表帳號名稱連到該帳號那一台的 Chrome 遠端桌面（連結同試算表績效表 B4:B12；CSV 讀不到超連結，機器換了要改這裡）
        // 放在這一頁、不放 common.js：帳號頁會單獨分享，不要帶到別台的連結
        const REMOTE_SESSION = {
            demo: 'f4dd324c-5a64-499d-a53d-b133d65e3b58', kgi: '61cbea15-89e2-caeb-681a-c6f05d0a526b', main: 'dc27f55f-4fa1-79c8-3436-beedaf4ec5c6',
            gary: 'dc27f55f-4fa1-79c8-3436-beedaf4ec5c6', mtk: 'f4dd324c-5a64-499d-a53d-b133d65e3b58', masterlink: '8efb9e56-5035-10f0-7d87-6be2a33f354a',
            richdad: 'f125983f-e03b-d7b8-be80-58a13690bb12', rick: 'f125983f-e03b-d7b8-be80-58a13690bb12', mom: '8efb9e56-5035-10f0-7d87-6be2a33f354a'
        };
        const remoteUrl = a => REMOTE_SESSION[a.id] ? `https://remotedesktop.google.com/access/session/${REMOTE_SESSION[a.id]}` : accountUrl(a);

        const RATIO_EXTREME = 0.30;
        const RATIO_WARNING = 0.35;
        const RATIO_MILD    = 0.40;
        const MARGIN_CRIT   = 10;
        const MARGIN_HIGH   = 20;
        const MARGIN_MED    = 30;
        const MARGIN_LOW    = 40;

        const isNegative = (val) => {
            if (typeof val !== 'string') return false;
            const trimmed = val.trim();
            return trimmed.startsWith('-') || (trimmed.startsWith('(') && trimmed.endsWith(')'));
        };

        const getRatioGradientClass = (header, val) => {
            if (!header || (!header.includes('比值平衡') && !header.includes('買權比值'))) return "";
            const num = parseFloat(val);
            if (isNaN(num) || (num >= RATIO_MILD && num <= (1 - RATIO_MILD))) return "";
            if (num <= RATIO_EXTREME || num >= (1 - RATIO_EXTREME)) return "bg-gradient-to-br from-yellow-500 via-yellow-400 to-yellow-300 text-slate-900 shadow-inner";
            if (num <= RATIO_WARNING || num >= (1 - RATIO_WARNING)) return "bg-gradient-to-br from-yellow-400 via-yellow-300 to-yellow-200 text-slate-900 shadow-sm";
            return "bg-gradient-to-br from-yellow-200 via-yellow-100 to-yellow-50 text-slate-900";
        };

        const getMarginGradientClass = (header, val) => {
            if (!header || (!header.includes('剩餘比率') && !header.includes('保證金剩餘比例'))) return "";
            const num = parseFloat(val.replace('%', ''));
            if (isNaN(num) || num > MARGIN_LOW) return "";
            if (num <= MARGIN_CRIT) return "bg-gradient-to-br from-red-950 via-red-900 to-red-800 text-white shadow-inner";
            if (num <= MARGIN_HIGH) return "bg-gradient-to-br from-red-800 via-red-700 to-red-600 text-white shadow-inner";
            if (num <= MARGIN_MED)  return "bg-gradient-to-br from-red-600 via-red-500 to-red-400 text-white";
            return "bg-gradient-to-br from-red-300 via-red-200 to-red-100 text-slate-900";
        };

        const getChangeColor = (val) => {
            if (!val) return 'text-white';
            const num = parseFloat(val.toString().replace('%', ''));
            if (num > 0) return 'text-red-500';
            if (num < 0) return 'text-green-500';
            return 'text-white';
        };

        const formatTime = (date) => date.toTimeString().split(' ')[0];

        // ===== 時間價值、期貨指數走勢：讀「兩分鐘紀錄」裡示範帳號那一列（頁首的數字也是這一列）=====
        const TREND_METRICS = {
            tv:  { label: '時間價值', color: '#d97706', spark: '#fde047', win: 4, note: '每 2 分鐘一筆，已濾掉資料跳點，可能和即時數字略有差距' },
            fut: { label: '期貨指數', color: '#2563eb', spark: '#e2e8f0', win: 3, note: '每 2 分鐘一筆，已濾掉資料跳點，可能和即時數字略有差距' },
            vix: { label: '波動率',   color: '#0d9488', spark: '#7dd3fc', d: 2, note: '臺指選擇權波動率指數，只有日盤；夜盤顯示最近一個日盤' }
        };
        const TREND_URL = since => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent('兩分鐘紀錄')}`
                                 + `&tq=${encodeURIComponent(`select A,F,K where B starts with '示範帳號' and A >= '${since}'`)}&t=${Date.now()}`;
        const sessionKey = p => `${p.week}-${p.slot}`;
        // 資料偶爾連續幾筆跳到離譜的數字（例：期指 46,000 跳 48,050），3 點平均濾不掉，所以用前後幾筆的中位數；每一盤分開算
        const medianIn = (pts, key, win) => pts.map((_, i) => {
            const v = pts.slice(Math.max(0, i - win), i + win + 1).map(p => p[key]).filter(x => x !== null).sort((a, b) => a - b);
            return v.length && pts[i][key] !== null ? v[v.length >> 1] : null;
        });
        // 盤中期指連續 5 筆（8 分鐘以上）一模一樣 = 報價卡住沒在更新，不是行情沒動：這段連時間價值一起當沒資料，線會斷開
        const STALE_RUN = 5;
        const dropStale = (pts) => {
            for (let i = 0, j; i < pts.length; i = j) {
                for (j = i + 1; j < pts.length && pts[j].fut === pts[i].fut; j++);
                if (j - i >= STALE_RUN) for (let k = i; k < j; k++) { pts[k].tv = null; pts[k].fut = null; }
            }
        };
        const parseTrend = (rows) => {
            const pts = rows.slice(1).map(r => ({ t: wallMs(r[0]), tv: toNum(r[1]), fut: toNum(r[2]) || null })).filter(p => p.t !== null)
                            .map(p => ({ ...p, ...slotAt(new Date(p.t)) }));
            const groups = new Map();
            pts.forEach(p => { const k = sessionKey(p); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
            groups.forEach(g => {
                dropStale(g);
                ['tv', 'fut'].forEach(key => {
                    const clean = medianIn(g, key, TREND_METRICS[key].win);
                    g.forEach((p, i) => { p[key] = clean[i]; });
                });
            });
            return pts;
        };
        const fetchTrend = async (since) => {
            const r = await fetch(TREND_URL(since.replace(/-/g, '/')));
            if (!r.ok) throw new Error('無法讀取走勢');
            return parseTrend(parseCSV(await r.text()));
        };
        const fmtTrend = (v, d) => v === null || v === undefined ? '—' : d ? v.toFixed(d) : Math.round(v).toLocaleString();

        // 波動率：期交所每 15 秒一筆、只有日盤；畫圖每 2 分鐘取一筆（最後一筆一定留著）
        const parseVixTicks = (v) => {
            if (!v || !v.tradeDay || !v.ticks) return [];
            const day = `${v.tradeDay.slice(0, 4)}-${v.tradeDay.slice(4, 6)}-${v.tradeDay.slice(6, 8)}`;
            const ticks = v.ticks.map(([t, x]) => [String(t).padStart(6, '0'), x]).filter(([t]) => t <= '134500');
            return ticks.filter((_, i) => i % 8 === 0 || i === ticks.length - 1).map(([t, x]) => {
                const ms = wallMs(`${day} ${t.slice(0, 2)}:${t.slice(2, 4)}:${t.slice(4, 6)}`);
                return { t: ms, vix: x, ...slotAt(new Date(ms)) };
            });
        };
        const fetchVix = (date) => fetch(date ? `${VIX_URL}?date=${date}` : VIX_URL).then(r => r.ok ? r.json() : null).catch(() => null);
        // 本週每個日盤；今天用即時的。週三夜盤剛換週、還沒有日盤時用最近一個日盤
        const fetchVixWeek = async (week) => {
            const today = ymd(tpeNow());
            const dates = SLOT_DEFS.filter(d => d.type === 'D').map(d => addDays(week, d.off)).filter(d => d < today);
            const [now, ...past] = await Promise.all([fetchVix(), ...dates.map(d => fetchVix(d.replace(/-/g, '')))]);
            const latest = parseVixTicks(now);
            const seen = new Set(latest.length ? [sessionKey(latest[0])] : []);
            const rows = past.map(parseVixTicks).filter(r => r.length && !seen.has(sessionKey(r[0]))).flat();
            const all = [...rows, ...latest].filter(p => p.week === week).sort((a, b) => a.t - b.t);
            return all.length ? all : latest;
        };

        // 走勢圖的 ECharts 第一次放大才載入，平常開總表不用多下載
        let echartsLoading = null;
        const loadEcharts = () => {
            if (window.echarts) return Promise.resolve();
            if (!echartsLoading) echartsLoading = new Promise((ok, fail) => {
                const el = document.createElement('script');
                el.src = 'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js';
                el.onload = ok;
                el.onerror = () => { echartsLoading = null; fail(new Error('無法載入圖表')); };
                document.head.appendChild(el);
            });
            return echartsLoading;
        };

        const Sparkline = ({ values, color }) => {
            const vs = values.filter(v => v !== null);
            if (vs.length < 2) return html`<span className="hl-spark"></span>`;
            const lo = Math.min(...vs), span = (Math.max(...vs) - lo) || 1;
            const yOf = v => 92 - (v - lo) / span * 84;
            const points = vs.map((v, i) => `${(i / (vs.length - 1) * 100).toFixed(2)},${yOf(v).toFixed(2)}`).join(' ');
            return html`
                <span className="hl-spark">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points=${points} style=${{ stroke: color }} /></svg>
                    <i style=${{ left: '100%', top: `${yOf(vs[vs.length - 1])}%`, background: color }}></i>
                </span>`;
        };

        const TrendChart = ({ rows, metric, showSessions }) => {
            const ref = useRef(null), chart = useRef(null);
            const m = TREND_METRICS[metric];
            // 手機轉向時重畫（直向、橫向的字級和邊界不同）
            const [turned, setTurned] = useState(0);
            useEffect(() => {
                const c = chart.current = echarts.init(ref.current);
                const onResize = () => c.resize();
                const portrait = matchMedia('(orientation: portrait)');
                const onTurn = () => setTurned(n => n + 1);
                window.addEventListener('resize', onResize);
                portrait.addEventListener('change', onTurn);
                return () => { window.removeEventListener('resize', onResize); portrait.removeEventListener('change', onTurn); c.dispose(); };
            }, []);
            useEffect(() => {
                const mPortrait = document.documentElement.classList.contains('m-portrait');
                const mLandscape = matchMedia('(orientation: landscape) and (max-height: 600px)').matches;
                const fontSize = mPortrait ? 24 : mLandscape ? 10 : 12;
                // 收盤到開盤沒有資料：橫軸照筆數排，不留大片空白；盤與盤之間斷開，畫一條分隔線
                const line = [], starts = new Set(), labels = {};
                rows.forEach((p, i) => {
                    const prev = rows[i - 1], newSession = !prev || sessionKey(prev) !== sessionKey(p);
                    if (newSession && prev) line.push({ t: null, [metric]: null });
                    if (newSession) starts.add(line.length);
                    if (showSessions) { if (newSession) labels[line.length] = `${SLOT_DEFS[p.slot].short}\n${mdLabel(slotDate(p.week, p.slot))}`; }
                    else if (newSession || hhmm(prev.t).slice(0, 2) !== hhmm(p.t).slice(0, 2)) labels[line.length] = hhmm(p.t);
                    line.push(p);
                });
                const peak = (type, color, position, offset) => ({ type, label: { color, position, offset, fontWeight: 'bold', formatter: p => fmtTrend(p.value, m.d) } });
                chart.current.setOption({
                    animation: false,
                    textStyle: { fontFamily: 'Arial' },
                    grid: mPortrait ? { left: 112, right: 40, top: 64, bottom: showSessions ? 96 : 60 }
                        : mLandscape ? { left: 48, right: 14, top: 18, bottom: showSessions ? 32 : 20 }
                        : { left: 62, right: 24, top: 30, bottom: showSessions ? 46 : 30 },
                    tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, confine: true, textStyle: { fontSize: mPortrait ? 30 : 14 },
                        formatter: ps => {
                            const p = ps[0] && line[ps[0].dataIndex];
                            return p && p.t !== null ? `<b>${mdhm(p.t)}</b> ${SLOT_DEFS[p.slot].label}<br>${ps[0].marker}${m.label}：<b>${fmtTrend(p[metric], m.d)}</b>` : '';
                        } },
                    xAxis: { type: 'category', boundaryGap: false, data: line.map((_, i) => i), axisTick: { show: false },
                        axisLine: { lineStyle: { color: '#cbd5e1' } },
                        splitLine: { show: true, interval: i => starts.has(i), lineStyle: { color: '#e2e8f0' } },
                        axisLabel: { interval: i => labels[i] !== undefined, hideOverlap: true, color: '#64748b', fontWeight: 'bold', fontSize, lineHeight: fontSize + 3, formatter: (_, i) => labels[i] || '' } },
                    yAxis: { type: 'value', scale: true, splitLine: { lineStyle: { type: 'dashed', color: '#f1f5f9' } },
                        min: v => v.min - (v.max - v.min) * .1, max: v => v.max + (v.max - v.min) * .1,
                        axisLabel: { color: '#64748b', fontWeight: 'bold', fontSize, showMinLabel: false, showMaxLabel: false, formatter: v => v.toLocaleString() } },
                    series: [{ name: m.label, type: 'line', data: line.map(p => p[metric]), connectNulls: false, showSymbol: false,
                        lineStyle: { width: mPortrait ? 4 : 2, color: m.color }, itemStyle: { color: m.color }, emphasis: { disabled: true },
                        markPoint: { symbol: 'circle', symbolSize: 0, label: { show: true, fontSize: mPortrait ? 26 : mLandscape ? 10 : 12 },
                                     data: [peak('max', '#ef4444', 'top', [0, -5]), peak('min', '#10b981', 'bottom', [0, 5])] } }]
                }, true);
                chart.current.resize();
            }, [rows, metric, showSessions, turned]);
            return html`<div ref=${ref}></div>`;
        };

        const TrendModal = ({ initial, current, onClose }) => {
            const [metric, setMetric] = useState(initial);
            const [range, setRange]   = useState('session');   // session = 當盤、week = 本週
            const [pts, setPts]       = useState(null);
            const [vixPts, setVixPts] = useState(null);
            const [failed, setFailed] = useState(null);
            const [ready, setReady]   = useState(!!window.echarts);
            useEffect(() => { loadEcharts().then(() => setReady(true), e => setFailed(e.message)); }, []);
            useEffect(() => {
                const load = () => {
                    const { week } = slotAt(tpeNow());
                    fetchTrend(slotOpen(week, 0)).then(p => { setPts(p.filter(x => x.week === week)); setFailed(null); }, e => setFailed(e.message));
                    fetchVixWeek(week).then(setVixPts);
                };
                load();
                const timer = setInterval(load, 120000);
                return () => clearInterval(timer);
            }, []);
            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);

            const source = metric === 'vix' ? vixPts : pts;
            const last = source && source.length ? source[source.length - 1] : null;
            const rows = !last ? [] : range === 'week' ? source : source.filter(p => sessionKey(p) === sessionKey(last));
            const sub = !last ? '' : range === 'week' ? `本週 ${mdhm(rows[0].t)} ~ ${mdhm(last.t)}` : `${SLOT_DEFS[last.slot].label} ${mdhm(rows[0].t)} ~ ${mdhm(last.t)}`;
            const msg = failed && metric !== 'vix' ? `${failed}，稍後再試` : !source || !ready ? '載入中…' : !rows.length ? '這一週還沒有走勢資料' : null;
            const tab = (on, label, click) => html`<button type="button" key=${label} className="tr-tab" aria-pressed=${on} onClick=${click}>${label}</button>`;

            return ReactDOM.createPortal(html`
                <div className="tr-back" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="tr-panel" role="dialog" aria-modal="true" aria-label=${`${TREND_METRICS[metric].label}走勢圖`}>
                        <div className="tr-head">
                            <span className="tr-title">${TREND_METRICS[metric].label}</span>
                            <span className="tr-value font-mono-data">${current[metric]}</span>
                            <span className="tr-sub">${sub}</span>
                            <span className="tr-note">${TREND_METRICS[metric].note}</span>
                        </div>
                        <div className="tr-controls">
                            <div className="tr-group">${Object.keys(TREND_METRICS).map(k => tab(metric === k, TREND_METRICS[k].label, () => setMetric(k)))}</div>
                            <div className="tr-group">${tab(range === 'session', '當盤', () => setRange('session'))}${tab(range === 'week', '本週', () => setRange('week'))}</div>
                            <button type="button" className="tr-close" onClick=${onClose}>✕ 關閉</button>
                        </div>
                        <div className="tr-chart">
                            ${msg ? html`<div className="tr-msg">${msg}</div>` : html`<${TrendChart} rows=${rows} metric=${metric} showSessions=${range === 'week'} />`}
                        </div>
                    </div>
                </div>`, document.body);
        };

        const getCellStyle = (header, cell) => {
            const val = cell || '';
            const isNeg  = isNegative(val);
            const isDisc = header.includes('更新時間') && val.includes('斷線');
            const ratioGradient = getRatioGradientClass(header, val);
            const marginClass   = getMarginGradientClass(header, val);
            const isRatioHeader = header.includes('買權比值') || header.includes('比值平衡');
            const num = parseFloat(val.replace('%', ''));
            const isAlertExtreme = isRatioHeader && !isNaN(num) && (num < RATIO_WARNING || num > (1 - RATIO_WARNING));
            // 獲利金額 / 獲利率跟當盤欄位同一套顏色：紅底 = 賺、綠底 = 賠
            const pnlNum = header.includes('獲利金額') || header.includes('獲利率') ? toNum(val) : null;
            const pnlClass = pnlNum === null ? '' : RESULT[resultOf(pnlNum)].cell;
            return { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme, pnlClass };
        };

        const App = () => {
            const [data, setData]               = useState([]);
            const [headers, setHeaders]         = useState([]);
            const [loading, setLoading]         = useState(true);
            const [refreshing, setRefreshing]   = useState(false);
            const [error, setError]             = useState(null);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [lastUpdated, setLastUpdated] = useState(null);
            const [countdown, setCountdown]     = useState(10);
            const [topStats, setTopStats]       = useState({ timeValue: '0.0', futureIndex: '0.0', pointsChange: '0.0', percentChange: '0%' });
            // 收完的盤 + 最新快照：給上面總表算「當盤獲利」、給下面每盤績效表用
            const [sessions, setSessions]       = useState([]);
            const [live, setLive]               = useState(null);
            // 頁首微型走勢（當盤）；trendKey = 目前放大的是哪一張圖
            const [trend, setTrend]             = useState([]);
            const [vixDay, setVixDay]           = useState([]);
            const [trendKey, setTrendKey]       = useState(null);
            const closeTrend = useCallback(() => setTrendKey(null), []);

            useEffect(() => {
                const load = () => {
                    const { week, slot } = slotAt(tpeNow());
                    fetchTrend(slotOpen(week, slot)).then(setTrend, () => {});
                };
                load();
                const timer = setInterval(load, 120000);
                return () => clearInterval(timer);
            }, []);
            useEffect(() => {
                const load = () => fetchVix().then(v => { const r = parseVixTicks(v); if (r.length) setVixDay(r); });
                load();
                const timer = setInterval(load, 60000);
                return () => clearInterval(timer);
            }, []);

            const loadSessions = useCallback(async () => {
                const t = Date.now();
                const [s, l] = await Promise.allSettled([
                    fetch(`${SESSIONS_URL}?t=${t}`).then(r => r.ok ? r.json() : null),
                    fetch(`${LIVE_URL}&t=${t}`).then(r => r.ok ? r.text() : '')
                ]);
                if (s.status === 'fulfilled' && s.value) setSessions(await fillMissing(s.value.sessions || [], slotAt(tpeNow()).week));
                if (l.status === 'fulfilled' && l.value) { const snap = parseSnapshots(parseCSV(l.value))[0]; setLive(snap ? { ...snap, live: true } : null); }
            }, []);
            useEffect(() => {
                loadSessions();
                const timer = setInterval(loadSessions, 60000);
                return () => clearInterval(timer);
            }, [loadSessions]);

            const fetchData = useCallback(async (isAuto = false) => {
                setCountdown(10);
                if (isAuto) setRefreshing(true);
                else setLoading(true);
                try {
                    const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                    if (!response.ok) throw new Error('無法讀取數據');
                    const text = await response.text();
                    if (!text) throw new Error('無法讀取數據');
                    const rawRows = parseCSV(text);
                    if (rawRows.length >= 2) {
                        const globalRow       = rawRows[0];
                        const originalHeaders = rawRows[1];
                        const originalData    = rawRows.slice(2);
                        const tvIdx = originalHeaders.findIndex(h => h.includes('時間價值'));
                        const fiIdx = originalHeaders.findIndex(h => h.includes('期貨指數'));
                        setTopStats({
                            timeValue:     tvIdx !== -1 ? (originalData[0] ? originalData[0][tvIdx] : '0.0') : '0.0',
                            futureIndex:   fiIdx !== -1 ? (originalData[0] ? originalData[0][fiIdx] : '0.0') : '0.0',
                            pointsChange:  globalRow[1] || '0',
                            percentChange: globalRow[2] || '0%'
                        });
                        // 試算表的「起始資產」在網站上顯示成「初始金額」
                        const filteredHeaders = originalHeaders.filter((_, idx) => idx !== tvIdx && idx !== fiIdx)
                            .map(h => h.trim() === '起始資產' ? '初始金額' : h);
                        // 帳號名稱不顯示「(主)」
                        const filteredData = originalData.map(row => row
                            .map((cell, idx) => idx === 0 ? cleanName(cell) : cell)
                            .filter((_, idx) => idx !== tvIdx && idx !== fiIdx));
                        setHeaders(filteredHeaders);
                        setData(filteredData);
                        setLastUpdated(new Date());
                        setError(null);
                    }
                } catch (err) {
                    setError('連線異常');
                } finally {
                    setLoading(false);
                    setRefreshing(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
                const syncTimer  = setInterval(() => fetchData(true), 10000);
                const clockTimer = setInterval(() => {
                    setCurrentTime(new Date());
                    setCountdown(c => (c > 0 ? c - 1 : 0));
                }, 1000);
                return () => { clearInterval(syncTimer); clearInterval(clockTimer); };
            }, [fetchData]);

            const handleManualRefresh = () => { if (!refreshing) fetchData(true); };

            // 當盤獲利 = 總表的累積獲利 − 這一盤開盤前的累積獲利；放在「獲利率」後面，紅 = 賺、綠 = 賠
            const baseline = sessionBaseline(sessions, live);
            const pnlIdx   = headers.findIndex(h => h.includes('獲利金額'));
            const rateIdx  = headers.findIndex(h => h.includes('獲利率'));
            const sessCol  = pnlIdx !== -1 && rateIdx !== -1 ? rateIdx : -1;
            const sessLabel = `當盤獲利${baseline ? `（${baseline.label}）` : ''}`;
            const keyOfName = n => (accountOf(n) || {}).id || cleanName(n);
            const sessOf = row => {
                const name = (row[0] || '').trim();
                if (!baseline || name.includes('參考')) return null;
                if (baseline.pending) return { pending: true };
                const b = name.startsWith('歐大總績效') ? baseline.total
                        : Object.entries(baseline.acc || {}).filter(([k]) => keyOfName(k) === keyOfName(name)).map(([, v]) => v)[0];
                const cur = toNum(row[pnlIdx]);
                if (!b || b.pnl === null || cur === null) return null;
                const pnl = cur - b.pnl;
                return { pnl, rate: b.base ? pnl / b.base * 100 : null };
            };
            const sessText = s => !s ? { pnl: '—', rate: '—', cls: 'text-slate-300' }
                : s.pending ? { pnl: '結算中', rate: '結算中', cls: 'text-slate-400' }
                : { pnl: sgnInt(s.pnl), rate: s.rate !== null ? sgnPct(s.rate) : '—', cls: (RESULT[resultOf(Math.round(s.pnl))] || {}).cell || 'text-slate-500' };
            const sessCells = row => {
                const t = sessText(sessOf(row));
                const cls = "px-4 py-2.5 text-xs font-black font-mono-data text-center " + t.cls;
                return [html`<td key="sp" className=${cls}>${t.pnl}</td>`, html`<td key="sr" className=${cls}>${t.rate}</td>`];
            };

            const renderCell = (cell, cIdx) => {
                const { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme, pnlClass } = getCellStyle(headers[cIdx] || '', cell);
                let cls = `px-4 py-2.5 text-xs ${pnlClass ? 'font-black' : 'font-bold'} font-mono-data text-center `;
                if (isDisc)              cls += "bg-red-600 text-white animate-pulse";
                else if (isAlertExtreme) cls += ratioGradient + " text-red-700 ring-2 ring-inset ring-red-600";
                else if (marginClass)    cls += marginClass;
                else if (ratioGradient)  cls += ratioGradient;
                else if (pnlClass)       cls += pnlClass;
                else if (isNeg)          cls += "text-red-500";
                else                     cls += "text-slate-700";
                const acct = cIdx === 0 && accountOf(cell);
                if (acct) return html`<td key=${cIdx} className=${cls}><a href=${remoteUrl(acct)} target="_blank" rel="noopener" title="連到這一台的遠端桌面" className="text-blue-700 underline decoration-blue-300 underline-offset-2 hover:text-blue-900">${cell}</a></td>`;
                return html`<td key=${cIdx} className=${cls}>${cell || '0'}</td>`;
            };

            // 試算表最後兩列（歐大總績效）不是帳號，抽出來合成一條總績效列：個人獲利 + 眾人獲利
            const isTotalRow = row => String(row[0]).trim().startsWith('歐大總績效');
            const accountRows = data.filter(row => !isTotalRow(row));
            const totals = (() => {
                const row = data.find(r => String(r[0]).trim() === '歐大總績效');
                const ref = data.find(r => isTotalRow(r) && r !== row);
                if (!row || pnlIdx === -1) return null;
                const at = i => (i === -1 ? '' : row[i] || '');
                const col = name => headers.findIndex(h => h.includes(name));
                return { row, personal: at(ref ? ref.findIndex(c => c.trim() === '個人獲利') : -1), group: at(pnlIdx), rate: at(rateIdx),
                         base: at(col('初始金額')), baseIdx: col('初始金額'), pts: at(col('總點數')), sess: sessText(sessOf(row)), sessRaw: sessOf(row) };
            })();
            // 深色底上的損益字色：紅 = 賺、綠 = 賠
            const darkTone = v => { const n = toNum(v); return n > 0 ? 'text-red-400' : n < 0 ? 'text-emerald-400' : 'text-slate-300'; };

            const renderTotalRow = () => {
                if (!totals || rateIdx === -1 || totals.baseIdx === -1) return null;
                const tdCls = "px-4 py-2 text-center font-mono-data font-black text-sm whitespace-nowrap ";
                const labeled = (label, labelCls, v) => html`
                    <span className=${"total-label block text-[10px] font-black leading-tight mb-0.5 " + labelCls}>${label}</span>
                    <span className=${darkTone(v)}>${v || '—'}</span>`;
                const sessTone = !totals.sessRaw || totals.sessRaw.pending ? 'text-slate-400' : darkTone(totals.sessRaw.pnl);
                return html`
                    <tr id="total-row" className="bg-slate-900">
                        <td className=${tdCls + "text-yellow-400"}>歐大總績效</td>
                        <td colSpan=${pnlIdx - 1} className=${tdCls + "bg-slate-800"}>${labeled('個人獲利', 'text-yellow-400', totals.personal)}</td>
                        <td className=${tdCls + "bg-slate-800"}>${labeled('眾人獲利', 'text-slate-300', totals.group)}</td>
                        <td className=${tdCls + darkTone(totals.rate)}>${totals.rate || '—'}</td>
                        ${sessCol !== -1 && html`<td className=${tdCls + sessTone}>${totals.sess.pnl}</td>`}
                        ${sessCol !== -1 && html`<td className=${tdCls + sessTone}>${totals.sess.rate}</td>`}
                        ${totals.baseIdx - rateIdx - 1 > 0 && html`<td colSpan=${totals.baseIdx - rateIdx - 1}></td>`}
                        <td className=${tdCls + "text-white"}>${totals.base || '—'}</td>
                        <td className=${tdCls + (isNegative(totals.pts) ? 'text-red-400' : 'text-white')}>${totals.pts || '—'}</td>
                    </tr>`;
            };

            const renderTotalCard = () => {
                if (!totals) return null;
                const item = (label, v, cls) => html`
                    <div key=${label} className="flex justify-between items-center gap-2 py-1 px-1.5">
                        <span className="text-[10px] font-black text-slate-400">${label}</span>
                        <span className=${"text-sm font-mono-data font-black " + cls}>${v || '—'}</span>
                    </div>`;
                return html`
                    <div className="col-span-full bg-slate-900 rounded-lg overflow-hidden shadow-sm">
                        <div className="px-3 py-1.5 border-b border-slate-700 text-yellow-400 font-black text-xs">歐大總績效</div>
                        <div className="p-2 grid grid-cols-2 gap-x-3">
                            ${item('個人獲利', totals.personal, darkTone(totals.personal))}
                            ${item('眾人獲利', totals.group, darkTone(totals.group))}
                            ${item('獲利率', totals.rate, darkTone(totals.rate))}
                            ${sessCol !== -1 && item('當盤獲利', totals.sess.pnl, totals.sessRaw && !totals.sessRaw.pending ? darkTone(totals.sessRaw.pnl) : 'text-slate-400')}
                            ${item('初始金額', totals.base, 'text-white')}
                            ${item('總點數', totals.pts, isNegative(totals.pts) ? 'text-red-400' : 'text-white')}
                        </div>
                    </div>`;
            };

            const renderDesktopRows = () => accountRows.map((row, rIdx) => {
                const cells = row.flatMap((cell, cIdx) => cIdx === sessCol ? [renderCell(cell, cIdx), ...sessCells(row)] : [renderCell(cell, cIdx)]);
                return html`<tr key=${rIdx} className="hover:bg-slate-50 transition-colors">${cells}</tr>`;
            });

            const renderMobileCards = () => accountRows.map((row, rIdx) => {
                const cardRows = headers.slice(1).map((h, i) => {
                    const cell = row[i + 1];
                    const { isNeg, isDisc, ratioGradient, marginClass, isAlertExtreme, pnlClass } = getCellStyle(h, cell);
                    let highlightClass = "";
                    let textClass = isNeg ? "text-red-500" : "text-slate-800";
                    if (marginClass)         { highlightClass = marginClass + " rounded"; if (marginClass.includes('text-white')) textClass = "text-white"; }
                    else if (isAlertExtreme) { highlightClass = ratioGradient + " rounded border-2 border-red-600 shadow-inner"; textClass = "text-red-700"; }
                    else if (isDisc)         { highlightClass = "bg-red-600 text-white rounded animate-pulse"; textClass = "text-white"; }
                    else if (ratioGradient)  { highlightClass = ratioGradient + " rounded border border-yellow-400 shadow-sm"; textClass = "text-slate-900"; }
                    else if (pnlClass)       { highlightClass = pnlClass + " rounded"; textClass = ""; }
                    const labelClass = "text-[9px] font-bold uppercase truncate max-w-[60px] leading-none tracking-tighter " + (highlightClass && textClass === "text-white" ? 'text-white' : 'text-slate-400');
                    return html`
                        <div key=${i} className=${"flex justify-between items-center border-b border-slate-50 py-1 px-1.5 " + highlightClass}>
                            <span className=${labelClass}>${h}</span>
                            <span className=${"text-xs font-mono-data font-black leading-none " + textClass}>${cell || '0'}</span>
                        </div>`;
                });
                if (sessCol !== -1) {
                    const t = sessText(sessOf(row));
                    const item = (k, label, v) => html`
                        <div key=${k} className=${"flex justify-between items-center border-b border-slate-50 py-1 px-1.5 rounded " + t.cls}>
                            <span className="text-[9px] font-black leading-none tracking-tighter text-slate-500">${label}</span>
                            <span className="text-xs font-mono-data font-black leading-none">${v}</span>
                        </div>`;
                    cardRows.splice(sessCol, 0, item('sp', sessLabel, t.pnl), item('sr', '當盤獲利率', t.rate));
                }
                return html`
                    <div key=${rIdx} className="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                        <div className="bg-slate-900 px-3 py-1.5 flex justify-between items-center">
                            ${accountOf(row[0])
                                ? html`<a href=${remoteUrl(accountOf(row[0]))} target="_blank" rel="noopener" className="text-white font-bold text-xs tracking-tight underline decoration-yellow-400 underline-offset-2">${row[0]} ›</a>`
                                : html`<span className="text-white font-bold text-xs tracking-tight">${row[0]}</span>`}
                            <span className="text-[8px] bg-yellow-400 text-slate-900 px-1.5 py-0.5 rounded font-black shrink-0">#${rIdx + 1}</span>
                        </div>
                        <div className="p-2 grid grid-cols-2 gap-y-1 gap-x-2">${cardRows}</div>
                    </div>`;
            });

            let mainContent;
            if (loading && data.length === 0) {
                mainContent = html`
                    <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                        <div className="w-8 h-8 border-4 border-slate-200 border-t-yellow-400 rounded-full animate-spin mb-4"></div>
                        <p className="text-xs font-bold uppercase tracking-widest font-mono">Loading Data...</p>
                    </div>`;
            } else if (error) {
                mainContent = html`
                    <div className="bg-red-50 border border-red-200 p-6 rounded-xl text-center my-10 max-w-sm mx-auto">
                        <p className="text-red-600 font-bold mb-4">⚠️ 連線異常</p>
                        <button onClick=${() => fetchData()} className="px-6 py-2 bg-red-600 text-white rounded-lg text-sm font-bold">重新嘗試</button>
                    </div>`;
            } else {
                mainContent = html`
                    <div className="max-w-7xl mx-auto">
                        <div className="hidden lg:block bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="bg-slate-900 text-slate-300">
                                            ${headers.flatMap((h, i) => {
                                const th = html`<th key=${i} className="px-4 py-3 text-[11px] font-black uppercase tracking-wider text-center border-slate-800">${h}</th>`;
                                return i !== sessCol ? [th] : [th,
                                    html`<th key="sp" className="px-4 py-3 text-[11px] font-black tracking-wider text-center text-yellow-400 bg-slate-800 whitespace-nowrap">${sessLabel}</th>`,
                                    html`<th key="sr" className="px-4 py-3 text-[11px] font-black tracking-wider text-center text-yellow-400 bg-slate-800 whitespace-nowrap">當盤獲利率</th>`];
                            })}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        ${renderDesktopRows()}
                                    </tbody>
                                    <tfoot>${renderTotalRow()}</tfoot>
                                </table>
                            </div>
                        </div>
                        <div id="account-links" className="flex flex-wrap items-center gap-1.5 sm:gap-2 my-2 sm:my-3">
                            <span className="text-[11px] font-black text-slate-500 mr-1">個別帳號績效</span>
                            ${accountRows.map(r => accountOf(r[0])).filter(Boolean).map(a => html`
                                <a key=${a.id} href=${accountUrl(a)} className="inline-flex items-center px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-black text-blue-700 shadow-sm hover:bg-blue-50 active:bg-blue-100 whitespace-nowrap">${a.name} ›</a>`)}
                        </div>
                        <div className="lg:hidden grid grid-cols-1 md:grid-cols-2 gap-2">
                            ${renderMobileCards()}
                            ${renderTotalCard()}
                            <div className="col-span-full py-10 text-center opacity-20">
                                <p className="text-[9px] font-black tracking-[0.4em] uppercase">END OF STREAM</p>
                            </div>
                        </div>
                    </div>`;
            }

            const pointsChangeNum = parseFloat(topStats.pointsChange);
            const pointsChangeFormatted = pointsChangeNum > 0 ? '+' + topStats.pointsChange : topStats.pointsChange;
            const trendCell = (key, value, valueClass) => html`
                <button type="button" key=${key} onClick=${() => setTrendKey(key)} title=${`放大${TREND_METRICS[key].label}走勢圖`}
                        className="hl-cell hl-btn flex-1 xl:flex-none flex flex-col items-center justify-center text-center">
                    <span className="hl-label">${TREND_METRICS[key].label} ›</span>
                    <span className="hl-body">
                        <span className=${valueClass + " font-mono-data"}>${value}</span>
                        <${Sparkline} values=${(key === 'vix' ? vixDay : trend).map(p => p[key])} color=${TREND_METRICS[key].spark} />
                    </span>
                </button>`;
            const vixValue = vixDay.length ? vixDay[vixDay.length - 1].vix.toFixed(2) : '--';
            const statCells = html`
                ${trendCell('tv', topStats.timeValue, 'hl-tv')}
                ${trendCell('fut', topStats.futureIndex, 'hl-fut')}
                <div className=${"hl-cell hl-chg-cell flex-1 xl:flex-none flex flex-col items-center justify-center text-center " + (pointsChangeNum > 0 ? 'hl-up' : pointsChangeNum < 0 ? 'hl-down' : '')}>
                    <span className="hl-label">漲跌</span>
                    <div className="hl-chg font-mono-data">
                        <span className="hl-pts">${pointsChangeFormatted}</span>
                        <span className="hl-pct">(${topStats.percentChange})</span>
                    </div>
                </div>
                ${trendCell('vix', vixValue, 'hl-vix')}`;

            return html`
                <div id="app-root" className="flex flex-col min-h-screen bg-slate-50 select-none overflow-x-hidden">
                    <header className="hidden sm:block sticky top-0 bg-slate-900 text-white shadow-lg z-50 border-b border-slate-800">
                        <div className="flex items-center justify-between px-3 py-1.5 border-b border-white/5">
                            <div className="flex items-center gap-2">
                                <div className=${"w-2 h-2 rounded-full " + (refreshing ? 'bg-yellow-400 animate-pulse' : 'bg-emerald-500')}></div>
                                <span className="text-[9px] font-bold tracking-widest text-slate-400 uppercase">System Active | ${VERSION}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                ${lastUpdated && html`<span className="data-time text-[9px] font-mono-data text-slate-500">資料 ${formatTime(lastUpdated)}</span>`}
                                <span className="text-[9px] font-mono-data text-slate-500">${refreshing ? '更新中…' : `${countdown}s 後更新`}</span>
                                <div className="text-[10px] font-mono-data font-bold text-slate-300">${formatTime(currentTime)}</div>
                            </div>
                        </div>
                        <div className="flex flex-col xl:flex-row xl:items-stretch">
                            <div className="bg-yellow-400 text-slate-900 px-4 py-3 md:py-4 flex-1 flex items-center">
                                <h1 className="text-xl md:text-2xl font-black italic tracking-tighter uppercase">歐大的投資報表</h1>
                            </div>
                            <div className="hl-stats flex divide-x divide-slate-800 bg-slate-900 border-t border-slate-800 xl:border-t-0">
                                ${statCells}
                                <button onClick=${handleManualRefresh} disabled=${refreshing} className="hl-refresh px-4 py-1.5 flex flex-col items-center justify-center text-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors disabled:opacity-40 cursor-pointer">
                                    <span className=${"text-base leading-none " + (refreshing ? 'animate-spin inline-block' : '')}>↻</span>
                                    <span className="text-[8px] font-bold uppercase mt-1 leading-none">刷新</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="sm:hidden sticky top-0 z-50 bg-slate-50 pb-1">
                        <div className="space-y-1">
                            <div className="flex justify-between items-center bg-slate-900 px-3 py-1.5 shadow-md">
                                <div className="flex items-center gap-1.5">
                                    <div className=${"w-1.5 h-1.5 rounded-full " + (refreshing ? 'bg-yellow-400 animate-pulse' : 'bg-emerald-500')}></div>
                                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">LIVE | ${VERSION}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    ${lastUpdated && html`<span className="text-[9px] font-mono-data text-slate-500">資料 ${formatTime(lastUpdated)}</span>`}
                                    <span className="text-[9px] font-mono-data text-slate-500">${refreshing ? '更新中…' : `${countdown}s後更新`}</span>
                                    <div className="text-[10px] font-mono-data text-slate-300 font-bold">${formatTime(currentTime)}</div>
                                    <button onClick=${handleManualRefresh} disabled=${refreshing} className=${"text-slate-400 hover:text-white disabled:opacity-40 text-sm leading-none cursor-pointer " + (refreshing ? 'animate-spin inline-block' : '')}>↻</button>
                                </div>
                            </div>
                            <div className="hl-stats flex divide-x divide-slate-800 bg-slate-900 overflow-hidden border-b border-slate-800 shadow-md">
                                ${statCells}
                            </div>
                        </div>
                    </div>

                    <div id="rotate-hint">
                        <svg className="rotate-hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                        <span>手機打橫看報表，字更大更清楚！</span>
                    </div>

                    <main className="p-1 sm:p-4 bg-[#f1f5f9]">
                        ${mainContent}
                    </main>
                    <${SessionPanel} sessions=${sessions} live=${live} />
                    <button type="button" id="trend-btn" onClick=${() => setTrendKey('tv')}>走勢圖</button>
                    ${trendKey && html`<${TrendModal} initial=${trendKey} current=${{ tv: topStats.timeValue, fut: topStats.futureIndex, vix: vixValue }} onClose=${closeTrend} />`}
                </div>`;
        };

        // ===== 每盤績效表：一週 10 盤，每一盤的勝敗（資料處理與表格在 common.js）=====
        const PERSONAL_ROW = '__personal';
        const SessionPanel = ({ sessions, live }) => {
            const [liveMarket, setLiveMarket] = useState({});
            const [liveVix, setLiveVix]       = useState(null);
            const [viewWeek, setViewWeek]     = useState('');
            // 補回資料的歷史週次（scripts/build_history_index.ts）：只含有補齊的帳號
            const [history, setHistory]       = useState(null);
            const currentWeek = (live && live.week) || slotAt(tpeNow()).week;
            useEffect(() => { fetch('data/history-index.json').then(r => r.ok ? r.json() : null).then(setHistory).catch(() => {}); }, []);

            const loadMarket = useCallback(async () => {
                const week = slotAt(tpeNow()).week;
                const [d, v] = await Promise.allSettled([
                    fetch(`${DEMO_URL}&t=${Date.now()}`).then(r => r.ok ? r.text() : ''),
                    fetch(VIX_URL).then(r => r.ok ? r.json() : null)
                ]);
                if (d.status === 'fulfilled' && d.value) setLiveMarket((parseDemo(parseCSV(d.value), week) || {}).market || {});
                if (v.status === 'fulfilled') setLiveVix(parseVix(v.value));
            }, []);

            useEffect(() => {
                loadMarket();
                const timer = setInterval(loadMarket, 120000);
                return () => clearInterval(timer);
            }, [loadMarket]);

            const week = viewWeek || currentWeek;
            const isCurrent = week === currentWeek;
            const historySessions = history ? history.sessions : [];
            const historyOfficial = history ? history.official : {};
            const isHistory = !isCurrent && (historySessions.some(s => s.week === week) || !!historyOfficial[week]);
            const rows = buildWeek(week, isHistory ? historySessions : sessions, isCurrent ? live : null, isCurrent ? liveMarket : {}, isCurrent ? liveVix : null);
            const weeks = [...new Set([currentWeek, ...sessions.map(s => s.week), ...historySessions.map(s => s.week), ...Object.keys(historyOfficial)])].sort().reverse();
            const sum = summarize(rows);
            // 週累積以官方為主（目前只有聯發哥 7/1 週以前跟每盤加總不同）：累積欄只留最後一格，其他顯示「—」
            const off = isHistory && historyOfficial[week] || null;
            const tableRows = !off ? rows : rows.map(r => {
                if (!r.state || r.pending) return r;
                if (sum.lastRow && r.i === sum.lastRow.i) return { ...r, cum: off.rate, state: { ...r.state, total: { ...r.state.total, pnl: off.total, personal: off.personal } } };
                return { ...r, cum: null };
            });
            const historyNote = isHistory ? `這一週只有已補齊資料的帳號，合計與個人獲利只含這些帳號${off && off.weeklyOnly.length ? `（${off.weeklyOnly.join('、')}只有週績效，沒有每盤資料）` : ''}。${off ? '週累積以試算表「歷史紀錄」為主，每盤獲利加總是推算值。' : ''}` : '';
            const accounts = [];
            sum.opened.forEach(r => r.state.accounts.forEach(a => { if (!accounts.includes(a.name)) accounts.push(a.name); }));
            if (off) Object.keys(off.acc).forEach(n => { if (!accounts.includes(n)) accounts.push(n); });
            const weekTag = isCurrent ? '（本週）' : `（${mdLabel(week)} 週）`;

            const weekPicker = html`
                <label className="ml-auto flex items-center gap-1.5 text-[10px] sm:text-[11px] font-bold text-slate-400">歷史週次
                    <select value=${viewWeek} onChange=${e => setViewWeek(e.target.value)} className="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-white cursor-pointer">
                        ${weeks.map(w => html`<option key=${w} value=${w === currentWeek ? '' : w}>${w === currentWeek ? '本週（即時）' : `${mdLabel(w)} 週`}</option>`)}
                    </select>
                </label>`;

            return html`
                <section id="session-panel" className="px-1 sm:px-4 pb-20 bg-[#f1f5f9]">
                    <div className="max-w-7xl mx-auto space-y-4">
                        <div id="page-session" className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-slate-900 px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1.5">
                                <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">每盤績效表<span className="text-white">${weekTag}</span></h2>
                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400">${off && !sum.lastRow ? `${mdLabel(rows[0].date)} ~ ${mdLabel(rows[9].date)} · 只有週績效 · 累積 ${sgnPct(off.rate)}` : weekSummary(rows, off ? { ...sum, cum: off.rate } : sum)}${off && sum.cum !== null ? `（官方；推算 ${sgnPct(sum.cum)}）` : ''}</span>
                                ${weekPicker}
                            </div>
                            <div id="win-strip"><${WinStrip} rows=${rows} /></div>
                            <${SessionTable} rows=${tableRows} showPersonal=${true} />
                            <p className="text-[10px] font-bold text-slate-400 px-3 sm:px-4 py-2">勝敗以全部帳號合計（眾人獲利）判定；獲利率 = 該盤獲利 ÷ 各帳號起始資產合計。紅 = 賺、綠 = 賠。${historyNote}<span className="sm:hidden">表格可左右滑動。</span></p>
                        </div>

                        ${accounts.length === 0 && html`<div id="page-accounts" className="hidden bg-white rounded-xl border border-slate-200 p-6 text-center text-xs font-bold text-slate-400">這一週還沒有各帳號每盤損益</div>`}
                        ${accounts.length > 0 && html`
                            <div id="page-accounts" className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                                <div className="bg-slate-900 px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1">
                                    <h2 className="text-yellow-400 font-black text-sm sm:text-base tracking-tight">各帳號每盤損益<span className="text-white">${weekTag}</span></h2>
                                    <span className="text-[10px] sm:text-[11px] font-bold text-slate-400">點帳號名稱看該帳號的獨立績效頁${isHistory ? `；這一週只有已補齊資料的帳號` : ''}</span>
                                    ${weekPicker}
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="bg-slate-900 text-slate-300">
                                                <th className=${TH + " sticky left-0 bg-slate-900 z-10"}>帳號</th>
                                                ${rows.map(r => html`<th key=${r.i} className=${TH}><div>${r.def.label}</div><div className="text-[9px] font-bold text-slate-500">${mdLabel(r.date)}</div></th>`)}
                                                <th className=${TH + " text-yellow-400"}>本週累積</th>
                                                <th className=${TH}>勝敗</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${[...accounts, null, PERSONAL_ROW].map(name => {
                                                const isTotal = name === null, isPersonal = name === PERSONAL_ROW, isSum = isTotal || isPersonal;
                                                const vals = rows.map(r => {
                                                    if (r.pending || r.pnl === undefined) return undefined;
                                                    if (isPersonal) return r.personal === null ? undefined : r.personal;
                                                    return isTotal ? r.pnl : r.acc[name];
                                                });
                                                const w = vals.filter(v => resultOf(v) === 'win').length, l = vals.filter(v => resultOf(v) === 'lose').length;
                                                const lastAcc = sum.lastRow && sum.lastRow.state.accounts.find(a => a.name === name);
                                                const calcVal = !sum.lastRow ? null : isTotal ? sum.lastRow.state.total.pnl : isPersonal ? sum.lastRow.state.total.personal : lastAcc ? lastAcc.pnl : null;
                                                // 官方數字為主，跟推算不同時小字標推算
                                                const offVal = !off ? undefined : isTotal ? off.total : isPersonal ? off.personal : off.acc[name];
                                                const cumVal = offVal !== undefined ? offVal : calcVal;
                                                const acct = !isSum && accountOf(name);
                                                return html`
                                                    <tr key=${name || '__total'} className=${isSum ? 'bg-slate-50 font-black' : ''}>
                                                        <td className=${TD + " sticky left-0 z-10 text-center " + (isSum ? 'bg-slate-50 text-slate-900' : 'bg-white text-slate-700')}>
                                                            ${isTotal ? '合計（眾人）' : isPersonal ? '個人獲利' : acct ? html`<a href=${accountUrl(acct)} className="text-blue-700 underline decoration-blue-300 underline-offset-2 hover:text-blue-900">${name}</a>` : name}
                                                        </td>
                                                        ${vals.map((v, k) => {
                                                            const res = resultOf(v);
                                                            return html`<td key=${k} className=${TD + " text-right " + (res ? RESULT[res].cell : 'text-slate-300')}>${v !== undefined ? sgnInt(v) : ''}</td>`;
                                                        })}
                                                        <td className=${TD + " text-right font-black leading-tight " + toneOf(cumVal)}>${cumVal !== null ? sgnInt(cumVal) : '—'}${offVal !== undefined && calcVal !== null && offVal !== calcVal ? html`<div className="text-[10px] font-bold text-slate-400">推算 ${sgnInt(calcVal)}</div>` : null}</td>
                                                        <td className=${TD + " text-center"}><span className="text-red-600">${w}勝</span> <span className="text-emerald-600">${l}敗</span></td>
                                                    </tr>`;
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>`}
                    </div>
                </section>`;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
